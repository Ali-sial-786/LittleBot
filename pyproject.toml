[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "littlebot"
version = "0.1.0"
description = "LittleBot - a gentle, expressive AI companion robot for young children (supervised prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal project" }
dependencies = [
    "pygame-ce>=2.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "psutil>=5.9",
    # YouTube search without an API key (littlebot/media/search.py runs `python -m yt_dlp`). A pure-Python
    # wheel with no required dependencies (fine on the Pi's aarch64). YouTube changes often: if search
    # stops working, update it with .venv/bin/python -m pip install -U yt-dlp
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
# Camera + face detection (OpenCV). On the Pi, the apt package python3-opencv also works.
vision = ["opencv-python-headless>=4.8,<5"]  # 5.x dropped the bundled Haar detector (our no-download fallback)
# Real microphone / speaker access via PortAudio (needs the libportaudio2 system package).
audio = ["sounddevice>=0.4.6"]
# PCA9685 servo controller over I2C (Raspberry Pi only; physical motion is disabled by default).
pi = ["smbus2>=0.4"]
# Optional offline speech recognition: the wake word ("Hey LittleBot" starts live voice) and local STT.
# vosk ships one prebuilt aarch64 wheel for every Python 3 (py3-none-manylinux2014_aarch64, ~2.4 MB);
# the model comes separately: scripts/download_models.py vosk-en (40 MB download, ~130 MB RAM).
local-stt = ["vosk>=0.3.45"]
# GPT-Live voice over WebRTC (Sign in with ChatGPT, docs/CHATGPT.md). aiortc is a pure-Python
# wheel; its dependencies (PyAV, pylibsrtp, cryptography, ...) have prebuilt aarch64 wheels
# (~40 MB download, nothing to compile). Without it, live voice reports itself as not installed.
live = ["aiortc>=1.10,<2"]
# Optional, opt-in: recognise the family's voices on the robot (littlebot/voices/, docs/VOICES.md). sherpa-onnx
# has prebuilt aarch64 wheels for Python 3.13 (~17 MB download); the model comes separately:
# scripts/download_models.py voices (26 MB, ~75 MB RAM while loaded).
voices = ["sherpa-onnx>=1.10"]
# Optional: Claude as the text model (text.provider: claude, decide.provider: claude; docs/CLAUDE.md).
claude = ["anthropic>=2.3,<3"]
# The fast voice pipeline (littlebot/assistant, docs/ASSISTANT.md): Deepgram's streaming speech-to-text needs a
# websocket client (vosk already brings it in for the wake word); Claude is its brain.
assistant = ["websockets>=12", "anthropic>=2.3,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.2"]
# Optional: drives the YouTube player page in headless Chromium in tests (skipped when absent).
browser-tests = ["playwright>=1.40"]
# Desktop development: everything needed to run the app and the full test-suite
# (the live-voice tests are skipped without aiortc).
all = ["littlebot[vision,audio,live,dev]"]

[project.scripts]
littlebot = "littlebot.app.main:main"

[tool.setuptools.packages.find]
include = ["littlebot*"]

[tool.setuptools.package-data]
littlebot = ["dashboard/static/**/*", "media/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "hardware: needs real devices (camera, microphone, speaker); skipped when unavailable",
    "slow: slower integration tests",
    "network: needs internet access; skipped by default",
]
filterwarnings = [
    "ignore::DeprecationWarning:pygame.*",
]
