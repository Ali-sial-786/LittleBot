<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>LittleBot player</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="player/static/player.css">
  <script src="player/static/player.js" defer></script>
</head>
<body>
  <!-- The official YouTube IFrame Player API puts its <iframe> inside #yt-host.
       Nothing is ever drawn over a live player (YouTube Required Minimum Functionality):
       the screens below are only shown while no player exists. -->
  <div id="stage"><div id="yt-host"></div></div>

  <div id="screen-idle" class="screen visible" aria-label="Waiting"><div class="soft-dot"></div></div>
  <div id="screen-loading" class="screen" aria-label="Loading">
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <div id="screen-done" class="screen" aria-label="All done">
    <div class="moon"></div>
    <p class="done-text">All done!</p>
  </div>
  <div id="screen-error" class="screen" aria-label="Video unavailable">
    <div class="soft-dot"></div>
    <p class="hint" id="error-text">This video can't play here.</p>
  </div>
</body>
</html>
