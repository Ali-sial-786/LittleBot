<!doctype html>
<html><head><meta charset="utf-8"><title>LittleBot v4 assembly</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #e9edf2; font-family: "DejaVu Sans", Arial, sans-serif; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #fbfcfd 0%, #e4e9ef 70%, #d7dde5 100%); }
  canvas { position: absolute; inset: 0; }
  #brand { position: absolute; left: 28px; top: 22px; color: #3b4452; font-size: 17px; letter-spacing: .3px; }
  #brand b { color: #1d2430; }
  #cap { position: absolute; left: 28px; bottom: 26px; width: 520px; background: rgba(255,255,255,.9); border-radius: 14px;
         padding: 14px 20px 15px; box-shadow: 0 4px 18px rgba(30,40,60,.12); }
  #num { color: #c0632b; font-size: 14px; font-weight: bold; letter-spacing: .6px; text-transform: uppercase; }
  #title { color: #1d2430; font-size: 25px; font-weight: bold; margin-top: 3px; }
  #detail { color: #3b4452; font-size: 16px; line-height: 1.4; margin-top: 6px; }

  #labels, #lines { position: absolute; inset: 0; }
  .lab { position: absolute; transform: translate(-50%, -100%); background: rgba(255,255,255,.95); border: 2.5px solid; border-radius: 10px;
         padding: 4px 11px 5px; font-size: 16px; font-weight: bold; white-space: nowrap; box-shadow: 0 3px 12px rgba(30,40,60,.16); }
</style></head>
<body>
<div id="bg"></div>
<canvas id="c" width="1280" height="720"></canvas>
<div id="brand"><b>LittleBot v4 “Soft Arc”</b> &middot; how it goes together</div>
<div id="labels"><svg id="lines" width="1280" height="720"></svg><div id="labs"></div></div>
<div id="cap"><div id="num"></div><div id="title"></div><div id="detail"></div></div>
<div id="bar"></div>
<script>
// The v4 assembly, step by step (README order). Every part, screw, nut and cable comes from manifest.json (place_parts.py,
// from the model). Each step is a list of phases, run one after another: parts arrive, screws are driven in one at a
// time by a tool that turns them, nuts drop into their pockets, cables grow along their routes, assemblies move.
// ---------- tiny maths ----------
const V = { sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}, lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t] };
function perspective(fovy, aspect, n, f) { const t = 1/Math.tan(fovy/2); return [t/aspect,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]; }
function lookAt(e, c, up) { const z = V.norm(V.sub(e,c)), x = V.norm(V.cross(up,z)), y = V.cross(z,x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -V.dot(x,e),-V.dot(y,e),-V.dot(z,e),1]; }
function mmul(a, b) { const r = new Array(16).fill(0); for (let i=0;i<4;i++) for (let j=0;j<4;j++) for (let k=0;k<4;k++) r[j*4+i] += a[k*4+i]*b[j*4+k]; return r; }
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease = t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
// 3 x 3 rotations, row-major
const R3 = {
  I: [1,0,0, 0,1,0, 0,0,1],
  mul: (a, b) => { const r = []; for (let i=0;i<3;i++) for (let j=0;j<3;j++) r.push(a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j]); return r; },
  app: (m, v) => [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]],
  axis: (k, deg) => { k = V.norm(k); const a = deg*Math.PI/180, c = Math.cos(a), s = Math.sin(a), t = 1-c, [x,y,z] = k;
    return [c+t*x*x, t*x*y-s*z, t*x*z+s*y,  t*x*y+s*z, c+t*y*y, t*y*z-s*x,  t*x*z-s*y, t*y*z+s*x, c+t*z*z]; },
  toZ: v => { v = V.norm(v); const c = v[2]; if (c > 0.9999) return R3.I.slice(); if (c < -0.9999) return [1,0,0, 0,-1,0, 0,0,-1];
    return R3.axis(V.cross([0,0,1], v), Math.acos(c)*180/Math.PI); },
  col: m => [m[0],m[3],m[6], m[1],m[4],m[7], m[2],m[5],m[8]],
};

// ---------- GL ----------
const gl = document.getElementById('c').getContext('webgl2', { antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec3 aPos; in vec3 aNor; in float aS;
uniform mat4 uVP; uniform mat3 uR; uniform vec3 uPiv; uniform vec3 uOff; uniform mat3 uW; uniform vec3 uWP;
out vec3 vN; out vec3 vW; out float vS;
void main() { vec3 p = uR * (aPos - uPiv) + uPiv + uOff; vec3 w = uW * (p - uWP) + uWP;
  vW = w; vN = uW * (uR * aNor); vS = aS; gl_Position = uVP * vec4(w, 1.0); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; in vec3 vN; in vec3 vW; in float vS;
uniform vec3 uCol; uniform float uAlpha; uniform float uHi; uniform float uEmit; uniform float uGrow; uniform vec3 uEye; out vec4 o;
void main() {
  if (vS > uGrow + 0.0001) discard;                       // cables grow along their route
  vec3 n = normalize(vN); vec3 v = normalize(uEye - vW); if (dot(n, v) < 0.0) n = -n;
  vec3 key = normalize(vec3(-0.45, -0.7, 0.75)), fill = normalize(vec3(0.7, -0.2, 0.3)), rim = normalize(vec3(0.2, 0.9, 0.4));
  float d = 0.36 + 0.55 * max(dot(n, key), 0.0) + 0.22 * max(dot(n, fill), 0.0) + 0.18 * max(dot(n, rim), 0.0) + 0.06 * n.z;
  float spec = pow(max(dot(n, normalize(key + v)), 0.0), 40.0) * 0.18;
  vec3 col = vS < -0.5 ? uCol * 0.3 : uCol;               // dark details: a socket, a nut's hole, a tool's grip
  vec3 c = col * d + spec;
  c += uHi * vec3(0.16, 0.09, 0.02);
  c = mix(c, col, uEmit);
  o = vec4(pow(clamp(c, 0.0, 1.0), vec3(0.95)), uAlpha);
}`));
gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
const uVP = U('uVP'), uR = U('uR'), uPiv = U('uPiv'), uOff = U('uOff'), uW = U('uW'), uWP = U('uWP'), uCol = U('uCol'), uAlpha = U('uAlpha'),
      uHi = U('uHi'), uEye = U('uEye'), uEmit = U('uEmit'), uGrow = U('uGrow');
const aPos = gl.getAttribLocation(prog, 'aPos'), aNor = gl.getAttribLocation(prog, 'aNor'), aS = gl.getAttribLocation(prog, 'aS');

const P = {};          // name -> {vao, count, col, centre, m (its manifest entry)}
let SCENE = null;
async function loadAll() {
  const man = await (await fetch('manifest.json')).json();
  SCENE = await (await fetch('scene.json')).json();
  for (const m of man) {
    const buf = await (await fetch(m.file)).arrayBuffer();
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(aNor); gl.vertexAttribPointer(aNor, 3, gl.FLOAT, false, 28, 12);
    gl.enableVertexAttribArray(aS); gl.vertexAttribPointer(aS, 1, gl.FLOAT, false, 28, 24);
    m.kind = m.kind || 'part';
    P[m.name] = { vao, count: buf.byteLength / 28, col: hex(m.colour), centre: V.mul(V.add(m.lo, m.hi), 0.5), m };
  }
  build();
}

// ---------- the story ----------
const ROBOT = { t: [0, 78, 215], az: -40, el: 14, d: 1300 };
const out = (s, k) => V.mul(SCENE.sh[s < 0 ? 0 : 1][1], k);          // along a shoulder's axis, outwards
// where an assembly waits before its step moves it (mm): the head servo below the plate, the Pi + UPS above the floor,
// the floor under the robot, the arms out beside their shoulders
let G0 = {};
const PARENT = { hservo: 'neck', stack: 'floor' };
const SEE_BODY = { body: 0.16, ring: 0.3, port_panel: 0.3 };
let STEPS = [];
function defineSteps() {
  G0 = { hservo: [0, 0, -85], stack: [0, 0, 90], floor: [0, 0, -240], arm_a: out(-1, 150), arm_b: out(1, 150) };
  const hinge = [0, SCENE.tab_hinge[0], SCENE.tab_hinge[1]];
  const BENCH_FLOOR = ['neck', 'body', 'ring', 'wires'];
  STEPS = [
  { title: 'The finished robot', detail: 'Here is what we are building: every part, screw, nut and cable, in the order they go in.', fixed: 6.0, intro: true,
    view: { ...ROBOT }, view2: { ...ROBOT, az: 35 } },
  // ---- the neck plate, on the bench
  { id: 'neck_plate', title: 'Neck plate, on the bench', detail: 'A drop of grease (or PTFE tape) on v2’s coupler’s bearing ring, then down through the neck plate.',
    phases: [{ parts: [['neck_plate', null, { label: 'neck plate' }], ['coupler', [0, 0, 70], { label: 'coupler (v2)' }]], gap: 0.6 }],
    view: { t: [0, 82, 245], az: -32, el: 30, d: 430 } },
  { id: 'ring_gear', title: 'Ring gear, from below', detail: 'Turn the plate over and screw the ring gear onto the coupler’s spigot: 3 × M3 × 12.',
    phases: [{ parts: [['ring_gear', [0, 0, -60]]] }, { screws: true }], view: { t: [0, 82, 236], az: -30, el: -38, d: 330 } },
  { id: 'head_servo', title: 'Head servo and pinion', detail: 'Horn into the pinion’s pocket: 2 horn screws. Servo onto its frame: 2 servo screws. Servo at 90°, pinion on its spline; push it all up (the pinion meshes, the collars go over the 2 pillars) and pinch the collars: 2 × M3 × 10.',
    phases: [{ parts: [['pinion', [0, 0, -40]], ['horn_head', [0, 0, -55], { label: 'servo horn' }]] }, { screws: 'horn screws' },
             { parts: [['servo_frame', [0, 0, -45]], ['servo_head', [0, 0, -60], { label: 'head servo' }]] }, { screws: 'servo screws' },
             { move: ['hservo', [0, 0, 0], 1.8] }, { screws: 'M3 × 10' }],
    view: { t: [0, 62, 196], az: -40, el: 6, d: 470 } },
  { id: 'puck', title: 'Black neck', detail: 'The puck sits on the coupler: 3 × M3 × 12 down through it, heads sunk.',
    phases: [{ parts: [['puck', [0, 0, 60], { label: 'black neck' }]] }, { screws: true }], view: { t: [0, 89, 252], az: -30, el: 34, d: 360 } },
  // ---- the body
  { id: 'arm_servos', title: 'Arm servos', detail: 'Slide each servo in from outside through its shoulder slot, spline outwards, and screw its tabs: 2 servo screws each.',
    hide: ['neck'], phases: [{ parts: [['body', null]] }, { parts: [['servo_r', out(-1, 70)], ['servo_l', out(1, 70)]] }, { screws: true }],
    view: { t: [0, 82, 196], az: -22, el: 12, d: 640 } },
  { id: 'speaker', title: 'Speaker', detail: 'Down through the open top, into its ribs behind the chest grille, facing forwards.',
    hide: ['neck'], see: SEE_BODY, phases: [{ parts: [['speaker', [0, 0, 170], { label: 'USB speaker' }]] }], view: { t: [0, 30, 150], az: -28, el: 16, d: 580 } },
  { id: 'mic', title: 'Microphone', detail: 'Plug the mic into its USB extension and push it into its pocket behind the left dot, holes forwards.',
    hide: ['neck'], see: SEE_BODY, phases: [{ parts: [['mic', [0, 0, 150], { label: 'USB mic + extension' }]] }], view: { t: [0, 25, 182], az: -28, el: 16, d: 520 } },
  { id: 'ring_nuts', title: 'Base ring: 4 nuts', detail: 'Lift the body off. Drop an M3 nut into each of the ring’s 4 tabs at the back.',
    hide: ['neck'], phases: [{ move: ['body', [0, 0, 170], 1.4] }, { parts: [['ring', null, { label: 'base ring' }]], with: true }, { nuts: true }],
    view: { t: [0, 118, 70], az: 150, el: 34, d: 640 } },
  { id: 'body_on', title: 'Body onto the ring', detail: 'Lower the body onto the ring’s lip.',
    hide: ['neck'], phases: [{ move: ['body', [0, 0, 0], 2.2] }], view: { t: [0, 78, 125], az: 145, el: 14, d: 920 } },
  { id: 'slider', title: 'UPS switch slider', detail: 'Push it in from outside through the slot in the back, fork first.',
    hide: ['neck'], phases: [{ parts: [['ups_slider', [0, 70, 0], { label: 'UPS switch slider' }]] }], view: { t: [-25, 160, 70], az: 160, el: 14, d: 420 } },
  { id: 'panel', title: 'Dark panel', detail: 'Hold it on and fit 4 × M3 × 12 along its bottom (through the body into the ring’s nuts), then 1 × M3 × 8 at its top.',
    hide: ['neck'], phases: [{ parts: [['port_panel', [0, 60, 0], { label: 'port panel' }]] }, { screws: true }], view: { t: [0, 150, 52], az: 162, el: 12, d: 470 } },
  // ---- the floor (v2's), on the bench
  { id: 'floor', title: 'The floor (v2’s), on the bench', detail: 'The electronics go onto v2’s floor first, outside the robot, where you can reach everything.',
    hide: BENCH_FLOOR, phases: [{ parts: [['floor', null, { label: 'floor (v2)' }]] }], view: { t: [0, 78, -205], az: -35, el: 32, d: 580 } },
  { id: 'stack', title: 'Pi 5 + UPS', detail: 'Cells into the UPS HAT (E). Pi onto it with the UPS kit’s 4 × M2.5 screws, Active Cooler on. Stand the clear plate in the floor’s groove, ports up. The keeper presses its top edge down, its arms rest on the boards’ top edges: 2 × M3 × 20.',
    hide: BENCH_FLOOR, phases: [{ parts: [['ups_plate', [0, 0, 50]], ['ups_cells', [0, 0, 50]], ['ups_standoffs', [0, 0, 50]], ['ups_board', [0, 0, 50], { label: 'UPS HAT (E) + cells' }]], gap: 0.25 },
             { parts: [['pi', [0, 70, 0], { label: 'Pi 5' }]] }, { screws: 'M2.5 × 6 (UPS kit)' }, { parts: [['cooler', [0, 60, 0]]] },
             { move: ['stack', [0, 0, 0], 1.8] }, { parts: [['keeper', [0, 0, 50], { label: 'stack keeper' }]] }, { screws: 'M3 × 20' }],
    view: { t: [0, 92, -170], az: 145, el: 24, d: 560 } },
  { id: 'pca', title: 'Servo board', detail: 'PCA9685 onto its 4 pins, servo pins to the back; a clamp over each end: 1 × M3 × 10 each. Jumpers from Pi pins 1, 3, 5, 6 to its I2C pins.',
    hide: BENCH_FLOOR, phases: [{ parts: [['pca', [0, 0, 45], { label: 'PCA9685' }], ['clamp0', [0, 0, 35]], ['clamp1', [0, 0, 35]]] }, { screws: true }, { cables: ['i2c'] }],
    view: { t: [-10, 40, -222], az: -38, el: 36, d: 470 } },
  { id: 'charge', title: 'Charging cable', detail: 'USB-C extension: its plug into the UPS’s USB-C (on the blue UPS board), never the Pi’s own. Its socket goes into the floor’s cradle at the back.',
    hide: BENCH_FLOOR, phases: [{ parts: [['usbc_socket', [0, 40, 0], { label: 'charging socket' }]] }, { cables: ['charging'] }],
    view: { t: [8, 112, -188], az: 155, el: 30, d: 430 } },
  // ---- the floor into the robot
  { id: 'floor_in', title: 'Floor into the base', detail: 'First plug the speaker and mic into the Pi and the arm servos into the PCA9685 (next step). Turn the robot over, lower the floor in: 4 × M3 × 12 through the ring’s sides. Turn it back and work the slider: the switch’s knob drops into its fork.',
    hide: ['neck'], phases: [{ wait: 0.7 }, { flip: 180 }, { move: ['floor', [0, 0, 0], 2.2] }, { mark: true }, { screws: true }, { flip: 0 },
             { wiggle: ['ups_slider', [1, 0, 0], SCENE.slider_travel] }],
    view: { t: [0, 78, 205], az: -34, el: 10, d: 1250 }, view2: { t: [0, 78, 140], az: -58, el: 14, d: 820 } },
  { id: 'cables_body', title: 'Body cables', detail: 'Speaker and mic into the Pi’s USB ports. Arm servos into the PCA9685: the robot’s left arm channel 1, its right arm channel 2.',
    hide: ['neck'], see: SEE_BODY, phases: [{ cables: ['speaker', 'mic', 'servo_left', 'servo_right'] }], view: { t: [0, 75, 115], az: -36, el: 14, d: 860 } },
  { id: 'cables_up', title: 'Cables up the neck', detail: 'Up out of the body’s top: the HDMI (its micro end in the Pi), the screen’s USB-C and the camera’s USB (both in the Pi’s USB ports), and the AA box’s leads (from the PCA9685’s V+ terminal).',
    hide: ['neck'], see: SEE_BODY, phases: [{ cables: ['hdmi', 'usbc', 'camera', 'aa'] }], view: { t: [0, 92, 150], az: 148, el: 10, d: 860 } },
  { id: 'plate_nuts', title: 'Neck plate nuts', detail: 'Drop an M3 nut into each of the body’s 4 ledge bosses.',
    hide: ['neck'], phases: [{ nuts: true }], view: { t: [0, 88, 236], az: -26, el: 48, d: 470 } },
  { id: 'plate_in', title: 'Neck plate in', detail: 'Head servo into PCA9685 channel 0 first. Feed the cables up through the coupler and set the plate in: 4 × M3 × 8 from the top.',
    phases: [{ move: ['neck', [0, 0, 200], 0.001], at: 0 }, { move: ['neck', [0, 0, 0], 2.4], at: 0.5 }, { screws: true }, { cables: ['servo_head'] }],
    see: { body: 0.3 }, view: { t: [0, 85, 250], az: -32, el: 24, d: 640 } },
  // ---- the head
  { id: 'head_on', title: 'Head onto the neck', detail: 'Cables up through the head’s floor, head onto the black neck: 3 × M3 × 10 down through its floor, from inside.',
    phases: [{ parts: [['head_frame', [0, 0, 150], { label: 'head frame' }], ['head_inlay', [0, 0, 150]]], gap: 0 }, { screws: true }],
    see: { head_frame: 0.4, head_inlay: 0.4 }, view: { t: [0, 92, 300], az: 150, el: 34, d: 600 } },
  { id: 'screen', title: 'Screen', detail: 'In through the face (nothing touches the glass), then 4 × M2.5 × 6 (or M3 × 6) from behind, down the 4 wells into its corner standoffs.',
    phases: [{ parts: [['screen', [0, -120, 0], { label: '7" touch screen' }]] }, { mark: true }, { screws: true }],
    view: { t: [0, 40, 340], az: -22, el: 8, d: 720 }, view2: { t: [0, 70, 340], az: 160, el: 14, d: 560 } },
  { id: 'plugs', title: 'Plugs, from behind', detail: 'The HDMI coupler into its 2 clips and the HDMI cable’s plug into it. Ribbon HDMI from the coupler to the screen. The right-angle USB-C into the screen.',
    see: { head_frame: 0.3, head_inlay: 0.3 },
    phases: [{ parts: [['coupler4', [0, 40, 0], { label: 'HDMI coupler' }]] }, { parts: [['hdmi_plug', [50, 0, 0]]] }, { cables: ['hdmi_head'] },
             { parts: [['fpc', [-12, 30, 0]]] }, { cables: ['ribbon'] }, { parts: [['usbc_plug', [-10, 30, 0]]] }, { cables: ['usbc_head'] }],
    view: { t: [-50, 66, 315], az: 140, el: 18, d: 470 } },
  { id: 'camera', title: 'Camera', detail: 'Board into v2’s bracket (it clicks), bracket up between the 2 cheeks under the hood, lens forwards. 2 × M3 × 12 from inside the head (2 mm L-key) through the cheeks into its pivots: set the tilt, snug. 5-pin plug into the board’s back.',
    phases: [{ parts: [['cam_board', [0, 0, -65], { label: 'camera' }], ['camera_bracket', [0, 0, -65]]], gap: 0 }, { screws: true }, { cables: ['camera_head'] }],
    view: { t: [0, 70, 404], az: 200, el: -16, d: 320 } },
  { id: 'aa_box', title: 'AA box', detail: '4 × AA NiMH cells in, lid on. Stand the box between its rails behind the neck, lid backwards; its leads come up the neck.',
    see: { head_frame: 0.35, head_inlay: 0.35 },
    phases: [{ parts: [['aa_tray', [0, 0, 110], { label: '4 × AA box' }]] }, { parts: [0, 1, 2, 3].map(k => ['aa_cell' + k, [0, 70, 0]]), gap: 0.3 },
             { parts: [['aa_lid', [0, 55, 0]]] }, { cables: ['aa_head'] }],
    view: { t: [0, 112, 300], az: 148, el: 22, d: 500 } },
  { id: 'back', title: 'Head back', detail: 'Hook its 2 slots over the frame’s 2 tabs, swing it down, then 2 × M3 × 12 from under the head.',
    phases: [{ parts: [['head_back', [0, 50, 40], { rot: { axis: [1, 0, 0], angle: 55, pivot: hinge } }]] }, { screws: true }],
    view: { t: [0, 120, 300], az: 128, el: 4, d: 680 } },
  { id: 'arms', title: 'Arms', detail: 'Horn into each arm’s pocket: 2 horn screws. Servos at their neutral angle: push each arm onto its spline, then the spline screw through the hole in the arm.',
    phases: [{ parts: [['arm_a', null], ['arm_b', null]], gap: 0 }, { parts: [['horn_r', out(-1, -30)], ['horn_l', out(1, -30)]] }, { screws: 'horn screws' },
             { move: ['arm_a', [0, 0, 0], 2.0] }, { move: ['arm_b', [0, 0, 0], 2.0], with: true }, { screws: 'spline screw' }],
    view: { t: [0, 82, 200], az: -22, el: 10, d: 1000 } },
  { title: 'Done!', detail: 'Keep motion switched off until the servos are calibrated (docs/MOTION_SAFETY.md).', fixed: 8.0, outro: true, view: { ...ROBOT, az: -20 } },
  ];
}

// ---------- the schedule: when each thing happens ----------
const PGAP = 0.35, PFADE = 0.3, PMOVE = 1.4, PROT = 1.3;     // parts: gap between, fade in, move in, swing
const SDT = 1.3, SAPP = 0.3, SDRV = 0.9, SRET = 0.35, TURNS = 4;   // screws: one after another, approach, drive (4 turns), tool away

const LABELS = [];

// ---------- one frame ----------
const Z3 = [0, 0, 0];
function render(T) {

  const items = [];

    const it = { L, a, x, y, half, side: x < 830 ? -1 : 1 };
