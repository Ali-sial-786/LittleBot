<!doctype html>
<html><head><meta charset="utf-8"><title>LittleBot v5 assembly</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #e9edf2; font-family: "DejaVu Sans", Arial, sans-serif; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #fbfcfd 0%, #e4e9ef 70%, #d7dde5 100%); }
  canvas { position: absolute; inset: 0; }
  #brand { position: absolute; left: 28px; top: 22px; color: #3b4452; font-size: 17px; letter-spacing: .3px; }
  #brand b { color: #1d2430; }
  #cap { position: absolute; left: 28px; bottom: 26px; width: 520px; background: rgba(255,255,255,.9); border-radius: 14px;
         padding: 14px 20px 15px; box-shadow: 0 4px 18px rgba(30,40,60,.12); }
  #num { color: #c0632b; font-size: 14px; font-weight: bold; letter-spacing: .6px; text-transform: uppercase; }
  #title { color: #1d2430; font-size: 25px; font-weight: bold; margin-top: 3px; }
  #detail { color: #3b4452; font-size: 16px; line-height: 1.4; margin-top: 6px; }
  #bar { position: absolute; left: 0; bottom: 0; height: 5px; background: #c0632b; }
  #labels, #lines { position: absolute; inset: 0; }
  .lab { position: absolute; transform: translate(-50%, -100%); background: rgba(255,255,255,.95); border: 2.5px solid; border-radius: 10px;
         padding: 4px 11px 5px; font-size: 16px; font-weight: bold; white-space: nowrap; box-shadow: 0 3px 12px rgba(30,40,60,.16); }
</style></head>
<body>
<div id="bg"></div>
<canvas id="c" width="1280" height="720"></canvas>
<div id="brand"><b>LittleBot v5 “Rover”</b> &middot; how it goes together</div>
<div id="labels"><svg id="lines" width="1280" height="720"></svg><div id="labs"></div></div>
<div id="cap"><div id="num"></div><div id="title"></div><div id="detail"></div></div>
<div id="bar"></div>
<script>
// The v5 assembly, step by step (README order). Every part, screw, nut and cable comes from manifest.json (place_parts.py,
// from the model). Each step is a list of phases, run one after another: parts arrive, screws are driven in one at a
// time by a tool that turns them, nuts drop into their pockets, cables grow along their routes, assemblies move.
// ---------- tiny maths ----------
const V = { sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}, lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t] };
function perspective(fovy, aspect, n, f) { const t = 1/Math.tan(fovy/2); return [t/aspect,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]; }
function lookAt(e, c, up) { const z = V.norm(V.sub(e,c)), x = V.norm(V.cross(up,z)), y = V.cross(z,x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -V.dot(x,e),-V.dot(y,e),-V.dot(z,e),1]; }
function mmul(a, b) { const r = new Array(16).fill(0); for (let i=0;i<4;i++) for (let j=0;j<4;j++) for (let k=0;k<4;k++) r[j*4+i] += a[k*4+i]*b[j*4+k]; return r; }
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease = t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
// 3 x 3 rotations, row-major
const R3 = {
  I: [1,0,0, 0,1,0, 0,0,1],
  mul: (a, b) => { const r = []; for (let i=0;i<3;i++) for (let j=0;j<3;j++) r.push(a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j]); return r; },
  app: (m, v) => [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]],
  axis: (k, deg) => { k = V.norm(k); const a = deg*Math.PI/180, c = Math.cos(a), s = Math.sin(a), t = 1-c, [x,y,z] = k;
    return [c+t*x*x, t*x*y-s*z, t*x*z+s*y,  t*x*y+s*z, c+t*y*y, t*y*z-s*x,  t*x*z-s*y, t*y*z+s*x, c+t*z*z]; },
  toZ: v => { v = V.norm(v); const c = v[2]; if (c > 0.9999) return R3.I.slice(); if (c < -0.9999) return [1,0,0, 0,-1,0, 0,0,-1];
    return R3.axis(V.cross([0,0,1], v), Math.acos(c)*180/Math.PI); },
  col: m => [m[0],m[3],m[6], m[1],m[4],m[7], m[2],m[5],m[8]],
};

// ---------- GL ----------
const gl = document.getElementById('c').getContext('webgl2', { antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, `#version 300 es
in vec3 aPos; in vec3 aNor; in float aS;
uniform mat4 uVP; uniform mat3 uR; uniform vec3 uPiv; uniform vec3 uOff; uniform mat3 uW; uniform vec3 uWP;
out vec3 vN; out vec3 vW; out float vS;
void main() { vec3 p = uR * (aPos - uPiv) + uPiv + uOff; vec3 w = uW * (p - uWP) + uWP;
  vW = w; vN = uW * (uR * aNor); vS = aS; gl_Position = uVP * vec4(w, 1.0); }`));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; in vec3 vN; in vec3 vW; in float vS;
uniform vec3 uCol; uniform float uAlpha; uniform float uHi; uniform float uEmit; uniform float uGrow; uniform vec3 uEye; out vec4 o;
void main() {
  if (vS > uGrow + 0.0001) discard;                       // cables grow along their route
  vec3 n = normalize(vN); vec3 v = normalize(uEye - vW); if (dot(n, v) < 0.0) n = -n;
  vec3 key = normalize(vec3(-0.45, -0.7, 0.75)), fill = normalize(vec3(0.7, -0.2, 0.3)), rim = normalize(vec3(0.2, 0.9, 0.4));
  float d = 0.36 + 0.55 * max(dot(n, key), 0.0) + 0.22 * max(dot(n, fill), 0.0) + 0.18 * max(dot(n, rim), 0.0) + 0.06 * n.z;
  float spec = pow(max(dot(n, normalize(key + v)), 0.0), 40.0) * 0.18;
  vec3 col = vS < -0.5 ? uCol * 0.3 : uCol;               // dark details: a socket, a nut's hole, a tool's grip
  vec3 c = col * d + spec;
  c += uHi * vec3(0.16, 0.09, 0.02);
  c = mix(c, col, uEmit);
  o = vec4(pow(clamp(c, 0.0, 1.0), vec3(0.95)), uAlpha);
}`));
gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
const uVP = U('uVP'), uR = U('uR'), uPiv = U('uPiv'), uOff = U('uOff'), uW = U('uW'), uWP = U('uWP'), uCol = U('uCol'), uAlpha = U('uAlpha'),
      uHi = U('uHi'), uEye = U('uEye'), uEmit = U('uEmit'), uGrow = U('uGrow');
const aPos = gl.getAttribLocation(prog, 'aPos'), aNor = gl.getAttribLocation(prog, 'aNor'), aS = gl.getAttribLocation(prog, 'aS');

const P = {};          // name -> {vao, count, col, centre, m (its manifest entry)}
let SCENE = null;
async function loadAll() {
  const man = await (await fetch('manifest.json')).json();
  SCENE = await (await fetch('scene.json')).json();
  for (const m of man) {
    const buf = await (await fetch(m.file)).arrayBuffer();
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(aNor); gl.vertexAttribPointer(aNor, 3, gl.FLOAT, false, 28, 12);
    gl.enableVertexAttribArray(aS); gl.vertexAttribPointer(aS, 1, gl.FLOAT, false, 28, 24);
    m.kind = m.kind || 'part';
    P[m.name] = { vao, count: buf.byteLength / 28, col: hex(m.colour), centre: V.mul(V.add(m.lo, m.hi), 0.5), m };
  }
  build();
}

// ---------- the story ----------
const ROBOT = { t: [0, 78, 215], az: -40, el: 14, d: 1320 };
const out = (s, k) => V.mul(SCENE.sh[s < 0 ? 0 : 1][1], k);          // along a shoulder's axis, outwards
// where an assembly waits before its step moves it (mm): the Pi + UPS above its mount, the drawer pulled out in front,
// the head servo below the cap, the arms out beside their shoulders
let G0 = {};
const PARENT = { hservo: 'neck' };
let STEPS = [];
// The order is the order there's room for each thing: the horns' glue first (it cures meanwhile); in the tub, the switch
// is wired before the deck covers its tabs, and every cable from the Pi and the deck is plugged in before the body goes
// on (the body's own cables with the body held over the tub; the head servo onto an extension with the cap held over
// the body); the speaker and the mic go in through the body's open bottom; the batteries go in last.
function defineSteps() {
  G0 = { stack: [0, 0, 90], tray: [0, -130, 0], hservo: [0, 0, -85], arm_a: out(-1, 150), arm_b: out(1, 150) };
  const hinge = [0, SCENE.tab_hinge[0], SCENE.tab_hinge[1]];
  const BASE = ['tub', 'podL', 'podR', 'stack', 'deck', 'tray', 'wires'];
  const LATER = ['neck', 'arm_a', 'arm_b'];                    // glued at the start, they wait off-screen until their steps
  const UPSIDE = { t: [0, 30, 180], az: 170, el: 52, d: 620 };   // into the body's open bottom, the body upside down (world coordinates)
  const BODY_CABLES = ['speaker', 'mic', 'servo_left', 'servo_right'];
  STEPS = [
  { title: 'The finished robot', detail: 'Here is what we are building: every part, screw, nut and cable, in the order they go in.', fixed: 6.0, intro: true,
    view: { ...ROBOT }, view2: { ...ROBOT, az: 35 } },
  // ---- glue first: it cures while you build
  { id: 'pinion_glue', title: 'First: glue the horn into the pinion', detail: 'Glue first, so it cures while you build. Sand the horn’s plate. A thin bead of 2-part epoxy along the pinion’s pocket, into its small holes but not the centre hole. Press the horn in. (Or 2 × M1.4 × 5 self-tapping screws.)',
    phases: [{ parts: [['pinion', [0, 0, -40]]] }, { glue: true }, { parts: [['horn_head', [0, 0, -45], { label: 'servo horn' }]] }],
    view: { t: V.add(SCENE.pinion_horn, G0.hservo), az: -12, el: -34, d: 230 } },
  { id: 'arm_glue', title: 'And the horns into the arms', detail: 'Both arms the same: sand the horn’s plate, a thin bead of epoxy along the arm’s pocket and into its small holes (not the centre hole), press the horn in. Leave all three to cure. (Or 2 × M1.4 × 5 self-tapping screws each.)',
    hide: ['neck'], phases: [{ parts: [['arm_a', null, { label: 'arm' }], ['arm_b', null]], gap: 0 }, { glue: true },
             { parts: [['horn_r', out(-1, -30), { label: 'servo horn' }], ['horn_l', out(1, -30)]] }],
    view: { t: V.add(SCENE.arm_pocket[0], out(-1, 150)), az: 75, el: 16, d: 280 } },
  // ---- the base
  { id: 'pod_bench', title: 'Wheel pods, at the bench', detail: 'Both the same. Push the motor’s boss through the pod’s plate from inside, its 2 threaded holes level: 2 × M3 × 8 from the wheel’s side. The coupler onto the shaft, its grub screw on the flat. The wheel on, with its own screw.',
    hide: LATER, phases: [{ parts: [['pod_l', null, { label: 'wheel pod' }], ['pod_r', null]], gap: 0 }, { parts: [['motor_l', [-45, 0, 0], { label: 'gear motor + coupler' }], ['motor_r', [45, 0, 0]]], gap: 0 },
             { screws: 'M3 × 8' }, { parts: [['wheel_l', [70, 0, 0], { label: '65 mm wheel' }], ['wheel_r', [-70, 0, 0]]], gap: 0 }, { screws: 'wheel’s own screw' }],
    view: { t: [70, 70, 40], az: 72, el: 14, d: 420 } },
  { id: 'casters', title: 'Ball casters', detail: 'Turn the tub over. Each caster into its square recess, front and back: its own 2 screws (#2-56) up through its base. Turn the tub back and put their nuts on, inside, while the floor is still bare.',
    hide: [...LATER, 'podL', 'podR'], pivot: [0, 78, 48], tagSpan: 60,
    phases: [{ parts: [['tub', null, { label: 'tub' }]] }, { flip: 180 }, { parts: [['caster_f', [0, 0, -45], { label: 'ball caster' }], ['caster_r', [0, 0, -45]]], gap: 0.3 },
             { screws: true, dt: 0.9 }, { flip: 0 }, { nuts: true }],
    view: { t: [0, 72, 48], az: -30, el: 36, d: 640 } },
  { id: 'pods_in', title: 'Wheel pods into the tub', detail: 'Lower each pod in, its wheel down through the slot in the floor: 4 × M3 × 12 through its flanges into the tub’s ridges. Zip-tie each motor’s tail to its saddle now: the deck will cover them.',
    hide: LATER, phases: [{ move: ['podL', [0, 0, 110], 0.001], at: 0 }, { move: ['podR', [0, 0, 110], 0.001], at: 0 }, { move: ['podL', [0, 0, 0], 2.0], at: 0.5 }, { move: ['podR', [0, 0, 0], 2.0], with: true },
             { screws: true, dt: 0.8 }],
    view: { t: [0, 70, 50], az: -28, el: 44, d: 660 } },
  { id: 'stack', title: 'Pi 5 + UPS', detail: 'The Pi + UPS from v4, as built. Stand its clear plate in the mount’s groove, ports up (over the rear caster’s nuts). v4’s keeper over it: 2 × M3 × 20.',
    hide: LATER, phases: [{ parts: [['pi_ups', null, { label: 'Pi 5 + UPS (from v4)' }]] }, { move: ['stack', [0, 0, 0], 1.8] }, { parts: [['stack_keeper', [0, 0, 50], { label: 'stack keeper (v4)' }]] }, { screws: true }],
    view: { t: [0, 122, 70], az: 150, el: 30, d: 520 } },
  { id: 'charge', title: 'Charging cable', detail: 'A USB-C extension. Its plug into the UPS’s USB-C (marked POWER, on the blue UPS board), never the Pi’s own. The cable runs to the back’s left corner: zip-tie its socket into the holder there, opening backwards.',
    hide: LATER, marks: [['ups_usbc', 'UPS USB-C (POWER): plug in here', '#2d6cb5', 0.4], ['pi_usbc', 'Pi’s own USB-C: leave it empty', '#c0392b', 1.0]],
    phases: [{ wait: 1.8 }, { cables: ['charging'] }, { parts: [['usbc_socket', [0, 0, 40], { label: 'its socket end' }]] }, { parts: [['zip_tie', [0, 0, 30], { label: 'zip tie' }]] }],
    view: { t: [-35, 140, 70], az: 152, el: 40, d: 430 } },
  { id: 'switch', title: 'Drive switch, wired now', detail: 'Snap the switch into its hole in the front wall, from outside. Wire it now: the deck will cover its tabs. One tab: a lead with the 5 A fuse, to the drawer’s bay (the battery plugs onto it last). The other: a lead long enough to reach the deck.',
    hide: LATER, phases: [{ parts: [['switch', [17, -36, 0], { label: 'drive switch' }]] }, { cables: ['battery'] }],
    view: { t: [45, 0, 45], az: -36, el: 42, d: 460 } },
  { id: 'deck_bench', title: 'Deck, at the bench', detail: 'The breadboard with the RP2040 on it, the motor driver on its 4 posts (4 × M3 × 8), the servo power board and the 5 V converter (zip ties through the slots). Wire them up here, where you can reach everything.',
    hide: [...LATER, ...BASE.filter(g => g !== 'deck')], phases: [{ parts: [['deck', null, { label: 'deck' }]] }, { parts: [['breadboard', [0, 0, 40], { label: 'breadboard' }], ['rp2040', [0, 0, 70], { label: 'RP2040' }]], gap: 0.5 },
             { parts: [['driver', [0, 0, 40], { label: 'motor driver (MDD3A)' }], ['driver_terms', [0, 0, 40]]], gap: 0 }, { screws: true, dt: 1.0 },
             { parts: [['perfboard', [0, 0, 40], { label: 'servo power board' }]] }, { parts: [['converter', [0, 0, 40], { label: '5 V converter' }]] }],
    view: { t: [0, 45, 75], az: -18, el: 52, d: 500 } },
  { id: 'deck_in', title: 'Deck onto the tub', detail: 'Onto the tub’s 4 posts: 4 × M3 × 8. Then the motors’ leads to the driver and their encoders’ to the RP2040 (they come up beside the Pi’s mount), and the switch’s lead to the deck.',
    hide: LATER, phases: [{ move: ['deck', [0, 0, 120], 0.001], at: 0 }, { move: ['deck', [0, 0, 0], 2.0], at: 0.5 }, { screws: true, dt: 1.0 }, { cables: ['motor_l', 'motor_r', 'enc_l', 'enc_r', 'switched'] }],
    view: { t: [0, 62, 62], az: -32, el: 44, d: 640 } },
  { id: 'cables_up', title: 'Plug in the head’s cables now', detail: 'While you can reach the Pi: the HDMI (its micro end in the Pi), the screen’s USB-C and the camera’s USB (both in the Pi’s USB ports), and a 3-wire jumper extension onto the servo power board for the head servo. Leave them standing up: they go up through the body and the neck.',
    hide: LATER, phases: [{ cables: ['hdmi', 'usbc', 'camera', 'servo_ext'] }], view: { t: [0, 100, 140], az: 148, el: 16, d: 820 } },
  // ---- the body, on the bench: upside down, everything goes in through its open bottom
  { id: 'body_nuts', title: 'Body, upside down: 8 nuts', detail: 'Turn the body upside down: its whole bottom is open, so everything inside goes in from here. Drop an M3 nut into each of the 8 slots in its tongue’s edge (a dab of tape keeps them in).',
    hide: [...LATER, ...BASE], pivot: [0, 78, 150], tagSpan: 400,
    phases: [{ parts: [['body', null, { label: 'body' }]] }, { flip: 180 }, { nuts: true }],
    view: { t: [0, 78, 150], az: -30, el: 34, d: 900 } },
  { id: 'speaker', title: 'Speaker and its keeper', detail: 'In through the open bottom: the speaker slides forwards between its 2 ribs onto their ledges, facing the chest grille. Its keeper behind it: the long tab into the left rib’s upper slot, swing it flat and let its spring click it into the right rib.',
    hide: [...LATER, ...BASE], see: { body: 0.5 },
    phases: [{ parts: [['speaker', [0, 80, 0], { label: 'USB speaker' }]] }, { parts: [['spk_keeper', [0, 60, 0], { label: 'speaker keeper' }]] }],
    view: UPSIDE },
  { id: 'mic', title: 'Microphone: ReSpeaker Lite', detail: 'Still upside down. The holder against the chest, behind the 2 dots. Push its key into the pocket from the robot’s left until its head sits flat (a firm push). The board onto the 2 posts, mics to the wall, its USB-C cable plugged in: 2 × M2 × 8.',
    hide: [...LATER, ...BASE], see: { body: 0.5 },
    phases: [{ parts: [['mic_holder', [0, 70, 0], { label: 'mic holder' }]] }, { parts: [['mic_key', [45, 0, 0], { label: 'key' }]] },
             { parts: [['respeaker', [0, 60, 0], { label: 'ReSpeaker Lite' }]] }, { parts: [['mic_plug', [35, 0, 0], { label: 'USB-C cable' }]] }, { screws: true }],
    view: { t: [0, 15, 135], az: 172, el: 58, d: 480 } },
  { id: 'arm_servos', title: 'Arm servos', detail: 'Turn the body back up. Slide each servo in from outside through its shoulder slot, spline outwards, and screw its tabs: 2 servo screws each. Add a jumper extension to each lead.',
    hide: [...LATER, ...BASE], pivot: [0, 78, 150], phases: [{ flip: 0 }, { parts: [['servo_r', out(-1, 70)], ['servo_l', out(1, 70)]] }, { screws: true }],
    view: { t: [0, 82, 190], az: -22, el: 12, d: 660 } },
  // ---- the body onto the tub: its cables plugged in first, with the body held over the tub
  { id: 'body_on', title: 'Body onto the tub', detail: 'Push the UPS switch slider in through the back, fork first. Hold the body over the tub (or prop it on something) and plug in its cables: the speaker and the ReSpeaker into the Pi’s USB ports, the arm servos onto the servo power board. Lower it, the cables from the Pi up through its top: its tongue goes inside the rim, the slider’s fork over the UPS switch’s knob. Then 8 × M3 × 10 through the rim into the tongue’s nuts.',
    hide: LATER, tagSpan: 400,
    phases: [{ move: ['body', [0, 0, 240], 0.001], at: 0 }, { parts: [['slider', [0, 70, 0], { label: 'UPS switch slider' }]], at: 0.6 }, { move: ['body', [0, 0, 150], 1.6] },
             { cables: BODY_CABLES.map(c => c + '_h') }, { drop: BODY_CABLES.map(c => c + '_h') }, { move: ['body', [0, 0, 0], 2.4], with: true },
             { show: BODY_CABLES }, { screws: true, dt: 0.8 }, { wiggle: ['slider', [1, 0, 0], SCENE.slider_travel] }],
    view: { t: [0, 88, 165], az: 118, el: 14, d: 1150 }, view2: { t: [0, 78, 125], az: 145, el: 18, d: 1050 }, view2After: 'show' },
  // ---- the neck, on the bench
  { id: 'ring_gear', title: 'Neck, at the bench: hub and ring gear', detail: 'The hub up through the cap from below, its flange under the cap. The ring gear (v2’s) onto the flange, from below: 3 × M3 × 12.',
    hide: [...BASE, 'body', 'arm_a', 'arm_b'], phases: [{ parts: [['cap', null, { label: 'cap' }]] }, { parts: [['hub', [0, 0, -60], { label: 'hub' }]] }, { parts: [['ring_gear', [0, 0, -50], { label: 'ring gear (v2)' }]] }, { screws: true }],
    view: { t: [0, 82, 232], az: -30, el: -36, d: 400 } },
  { id: 'black_neck', title: 'Black neck', detail: 'Slide an M3 nut into each of the 3 slots in the hub’s side. The black neck over the hub, its rib in the hub’s groove: 3 × M3 × 12, heads sunk.',
    hide: [...BASE, 'body', 'arm_a', 'arm_b'], phases: [{ nuts: true }, { parts: [['neck', [0, 0, 60], { label: 'black neck' }]] }, { screws: true }],
    view: { t: [0, 89, 250], az: -30, el: 30, d: 380 } },
  { id: 'head_servo', title: 'Head servo', detail: 'Glue cured: servo onto its frame, 2 servo screws. Servo at 90°, the pinion’s horn onto its spline. Push it all up under the cap (the pinion meshes with the ring gear, the collars go over the cap’s 2 pillars) and pinch the collars: 2 × M3 × 10.',

// the epoxy syringe: its nozzle on the bead's tip as the bead grows, tilted a little; in along the pocket's axis, back out
function drawGlue(draws, m, w, k, goff, alpha, W, eye) {
  const p = P.tool_glue; if (!p) return;
  const f = m.frac, r = m.route; let j = 1; while (j < f.length - 1 && f[j] < k) j++;
  const tip = V.lerp(r[j - 1], r[j], f[j] > f[j - 1] ? clamp((k - f[j - 1]) / (f[j] - f[j - 1])) : 1);

  const d = m.dir, up = V.sub([0, 0, 1], V.mul(d, d[2])), tw = toWorld(W, V.add(tip, goff));
  const ax = Math.hypot(...up) > 0.3 ? V.norm(V.sub(d, V.mul(V.norm(up), 1.5))) : V.norm(V.add(d, V.mul(V.norm(V.cross(d, V.sub(eye, tw))), 0.6)));

// labels: a leader from the point to a tag beside it. Tags without their own offset go out sideways and are spread

function drawLabels(list, s, u, VP, T, W) {
  const items = [];
  for (const L of list) {
    const a = clamp(Math.min((u - L.t) / 0.4, (s.dur - 0.25 - u) / 0.25, L.until !== undefined ? (L.until - u) / 0.3 : 1)); if (a <= 0) continue;
    const w = toWorld(W, V.add(L.at, groupOff(L.group, T))), c = [0, 1, 2, 3].map(r => VP[r] * w[0] + VP[4 + r] * w[1] + VP[8 + r] * w[2] + VP[12 + r]);
    if (c[3] <= 0) continue;
    const x = (c[0] / c[3] + 1) * 640, y = (1 - c[1] / c[3]) * 360, half = (L.text.length * 9.6 + 28) / 2;
    const it = { L, a, x, y, half, side: x < 830 ? -1 : 1 };
    it.lx = x + it.side * (half + 70); it.ly = y - 40;
    items.push(it);
  }
  for (const side of [-1, 1]) {
    const col = items.filter(it => it.side === side).sort((p, q) => p.ly - q.ly);
    for (let k = 1; k < col.length; k++) col[k].ly = Math.max(col[k].ly, col[k - 1].ly + 36);
    const lim = side < 0 ? 520 : 690;
    for (let k = col.length - 1; k >= 0; k--) { col[k].ly = Math.min(col[k].ly, k === col.length - 1 ? lim : col[k + 1].ly - 36); col[k].ly = Math.max(col[k].ly, 70); }
  }

  for (const it of items) {
    it.lx = clamp(it.lx, it.half + 8, 1272 - it.half);
    if (it.ly > 520 && it.lx - it.half < 565) it.lx = 565 + it.half;      // not over the caption
    const col = it.L.col;
    lines += `<g opacity="${it.a}"><line x1="${it.x}" y1="${it.y}" x2="${it.lx}" y2="${it.ly - 2}" stroke="${col}" stroke-width="2.5"/><circle cx="${it.x}" cy="${it.y}" r="6" fill="none" stroke="${col}" stroke-width="3"/></g>`;
    labs += `<div class="lab" style="left:${it.lx}px;top:${it.ly}px;border-color:${col};color:${col};opacity:${it.a}">${it.L.text}</div>`;
  }

}
function drawOne(d) {

  gl.uniformMatrix3fv(uR, false, R3.col(d.R)); gl.uniform3fv(uPiv, d.piv); gl.uniform3fv(uOff, d.off);
  gl.uniform3fv(uCol, d.p.col); gl.uniform1f(uGrow, d.grow); gl.uniform1f(uAlpha, d.alpha); gl.uniform1f(uHi, d.hi); gl.uniform1f(uEmit, d.p.emit || 0);
