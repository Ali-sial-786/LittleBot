<script>
// LittleBot v5, finishing the build: a 2D canvas animation driven by steps.json (what to show and say) and timeline.json
// (each step's start and length, from the narration). render.js calls window.render(t) frame by frame; for a '3d' step it
// first renders the assembly video's page (../assembly_video) and hands the picture and its labels' positions in.
// The wiring bench is drawn MIRRORED (world x flipped on screen, text kept readable): the YD-RP2040 sits in the
// breadboard chip side down, so its pins are the mirror image of a Pico drawn chip side up. Breadboard holes are
// named by their real letters (a-e on the left, f-j on the right, as printed on the breadboard).
'use strict';
const W = 1920, H = 1080, cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"DejaVu Sans", "Noto Sans", sans-serif';
let STEPS, TL, TOTAL, IMG = {};

// ---------------------------------------------------------------- colours
const C = {
  red: '#d62828', black: '#1f1f1f', v5: '#ef6c00', brown: '#7b4a2a', sig: '#f4a300', white: '#f4f4f4',
  yellow: '#e2b800', green: '#2b9348', blue: '#1c64f2', teal: '#0f8b8d', tx: '#8e24aa', rx: '#5e35b1', sense: '#c2185b',
  ink: '#1d2430', mute: '#5c6675', hl: '#ffd23f', board: '#f7f6f1'
};

// ---------------------------------------------------------------- layout (world units)
const P = 25, BBX = 1250, BBY = 300;
const COL = { a: 0, b: 1, c: 2, d: 3, e: 4, f: 7, g: 8, h: 9, i: 10, j: 11 };
const colX = i => BBX + 110 + i * P, rowY = r => BBY + 60 + (r - 1) * P;
const PICO_L = ['GP0', 'GP1', 'GND', 'GP2', 'GP3', 'GP4', 'GP5', 'GND', 'GP6', 'GP7', 'GP8', 'GP9', 'GND', 'GP10', 'GP11', 'GP12', 'GP13', 'GND', 'GP14', 'GP15'];
const PICO_R = ['Vout', 'Vin', 'GND', 'GP23', '3V3', 'GP29', 'GP28', 'GND', 'GP27', 'GP26', 'RUN', 'GP22', 'GND', 'GP21', 'GP20', 'GP19', 'GP18', 'GND', 'GP17', 'GP16'];
const USED = new Set(['GP0', 'GP1', 'GND', 'GP6', 'GP7', 'GP8', 'GP9', 'GP10', 'GP11', 'GP12', 'GP13', 'GP14', 'GP15', 'GP16', 'GP26', 'Vin', '3V3']);
const MIRL = k => 'jihgfedcba'['abcdefghij'.indexOf(k)];   // a real hole letter -> the world column it's drawn in
const PI = { x0: 300, x1: 1100, y0: 40, y1: 232, px: n => 430 + Math.floor((n - 1) / 2) * 26, py: n => (n % 2 ? 182 : 207) };
const MOT = [{ y: 450, name: 'left motor' }, { y: 930, name: 'right motor' }];
const MOT_W = ['blue', 'black', 'yellow', 'green', 'red', 'white'];
const MD = { x0: 640, y0: 1230, x1: 1000, y1: 1560, hdr: ['M1A', 'M1B', 'M2A', 'M2B', 'GND', '5V'] };
const WAGO = { x0: 2050, w: 330, h: 80, y: { A: 360, B: 620, C: 880, D: 1140 },
  name: { A: 'battery +', B: 'ground', C: '5 V', D: 'ground' }, col: { A: C.red, B: C.black, C: C.v5, D: C.black } };
const slotX = k => WAGO.x0 + 45 + (k - 1) * 60;
const BAT = { x0: 2560, y0: 60, x1: 3200, y1: 230 }, FUSE = { x: 2600, y0: 372, y1: 480 }, SW = { x: 2475, y: 480 }, XT = { x: 2650, y: 300 };
const CONV = { x0: 2560, y0: 690, x1: 2900, y1: 800 };
const SERVO = { H: { y: 1080, name: 'head servo' }, L: { y: 1290, name: 'left arm servo' }, R: { y: 1500, name: 'right arm servo' }, x: 2800 };

function A(n) {               // a named point
  let m;
  if ((m = n.match(/^bb:([a-j])(\d+)$/))) return [colX(COL[MIRL(m[1])]), rowY(+m[2])];
  if ((m = n.match(/^rp:(\d+)$/))) { const p = +m[1]; return p <= 20 ? [colX(2), rowY(p)] : [colX(9), rowY(41 - p)]; }
  if ((m = n.match(/^pi:(\d+)$/))) return [PI.px(+m[1]), PI.py(+m[1])];
  if ((m = n.match(/^w([ABCD])(\d)$/))) return [slotX(+m[2]), WAGO.y[m[1]] + WAGO.h];
  if ((m = n.match(/^m([LR]):(\d)$/))) return [610, MOT[m[1] === 'L' ? 0 : 1].y + 22 + 15 * m[2]];
  if ((m = n.match(/^md:t(\d)$/))) return [MD.x0 - 22, [1290, 1330, 1440, 1480][+m[1]]];          // motor terminals M1A M1B M2A M2B
  if ((m = n.match(/^md:h(\w+)$/))) { const k = MD.hdr.map(s => s.toLowerCase()).indexOf(m[1]); return [700 + k * 50, MD.y0 + 18]; }
  if (n === 'md:vp') return [790, MD.y1 + 34]; if (n === 'md:vn') return [850, MD.y1 + 34];
  if (n === 'cv:ip') return [CONV.x0 - 40, 710]; if (n === 'cv:in') return [CONV.x0 - 40, 732];
  if (n === 'cv:op') return [CONV.x0 - 40, 760]; if (n === 'cv:on') return [CONV.x0 - 40, 782];
  if (n === 'bat:p') return [XT.x - 10, XT.y + 20]; if (n === 'bat:n') return [XT.x + 10, XT.y + 20];   // the robot's half of the plug
  if (n === 'fu:a') return [FUSE.x, FUSE.y0]; if (n === 'fu:b') return [FUSE.x, FUSE.y1];
  if ((m = n.match(/^sw:(\d)$/))) return [SW.x - 35 + (m[1] - 1) * 35, SW.y + 82];
  if ((m = n.match(/^sv([HLR]):(\w+)$/))) {
    const y = SERVO[m[1]].y, px = SERVO.x - 230;
    if (m[2] === 'plug') return [px, y]; return [px - 14, y + { o: -16, r: 0, n: 16 }[m[2]]];
  }
  throw new Error('no point ' + n);
}

// ---------------------------------------------------------------- the wires
// each: colour, points (start, via..., end), start and end directions (the spline's tangents), kind
const WIRES = {};
function wire(id, col, pts, sd, ed, opt = {}) { WIRES[id] = Object.assign({ id, col, pts: pts.map(p => typeof p === 'string' ? A(p) : p), sd, ed }, opt); }
const R = [1, 0], L = [-1, 0], U = [0, -1], D = [0, 1];
// orth: true = straight runs with rounded corners through the points (else a smooth spline through them)
// motors -> driver (already done)
wire('mL_red', C.red, ['mL:4', [580, 532], [580, 1290], 'md:t0'], R, R, { done: 1, orth: 1 });
wire('mL_wht', C.white, ['mL:5', [565, 547], [565, 1330], 'md:t1'], R, R, { done: 1, orth: 1 });
wire('mR_red', C.red, ['mR:4', [550, 1012], [550, 1440], 'md:t2'], R, R, { done: 1, orth: 1 });
wire('mR_wht', C.white, ['mR:5', [535, 1027], [535, 1480], 'md:t3'], R, R, { done: 1, orth: 1 });
// power: the batteries, the fuse, the switch
wire('bat_fuse', C.red, ['bat:p', [2640, 345], [2600, 345], 'fu:a'], D, D, { orth: 1 });
wire('fuse_sw', C.red, ['fu:b', [2600, 620], [2440, 620], 'sw:1'], D, U, { orth: 1 });
wire('sw_A1', C.red, ['sw:2', [2475, 600], [2400, 600], [2400, 470], [2095, 470], 'wA1'], D, U, { orth: 1 });
wire('bat_B1', C.black, ['bat:n', [2660, 345], [2960, 345], [2960, 730], [2095, 730], 'wB1'], D, U, { orth: 1 });
wire('A2_mdp', C.red, ['wA2', [2155, 486], [1960, 486], [1960, 1650], [790, 1650], 'md:vp'], D, U, { orth: 1 });
wire('B2_mdn', C.black, ['wB2', [2155, 746], [1980, 746], [1980, 1672], [850, 1672], 'md:vn'], D, U, { orth: 1 });
wire('A3_cvi', C.red, ['wA3', [2215, 502], [2385, 502], [2385, 710], 'cv:ip'], D, R, { orth: 1 });
wire('B3_cvi', C.black, ['wB3', [2215, 790], [2410, 790], [2410, 732], 'cv:in'], D, R, { orth: 1 });
wire('cvo_C1', C.v5, ['cv:op', [2440, 760], [2440, 990], [2095, 990], 'wC1'], L, U, { orth: 1 });
wire('cvo_D1', C.black, ['cv:on', [2460, 782], [2460, 1250], [2095, 1250], 'wD1'], L, U, { orth: 1 });
wire('B5_D5', C.black, ['wB5', [2335, 812], [2425, 812], [2425, 1268], [2335, 1268], 'wD5'], D, U, { orth: 1 });
// the RP2040's power
wire('vsys_C5', C.v5, ['bb:b2', [1840, 385], [1840, 1008], [2335, 1008], 'wC5'], R, U, { orth: 1 });
wire('gnd_B4', C.black, ['bb:b3', [1820, 410], [1820, 768], [2275, 768], 'wB4'], R, U, { orth: 1 });
// the driver's control pins: a nested bundle up the breadboard's left side
MD.hdr.slice(0, 5).forEach((sn, k) => {
  const id = ['c_m1a', 'c_m1b', 'c_m2a', 'c_m2b', 'c_gnd'][k], hole = 'bb:j' + (14 + k), x = 700 + k * 50, y = rowY(14 + k);
  wire(id, k === 4 ? C.black : C.teal, ['md:h' + sn.toLowerCase(), [x, 1150 + 12 * k], [1180 + 14 * k, 1150 + 12 * k], [1180 + 14 * k, y], hole], U, R, { orth: 1 });
});
// encoders (lead order top to bottom: blue, black, yellow, green, red, white)
const enc = (id, side, k, hole, jx) => { const st = A('m' + side + ':' + k), en = A(hole); wire(id, C[MOT_W[k]], [st, [jx, st[1]], [jx, en[1]], en], R, R, { orth: 1 }); };
wire('eL_k', C.black, [A('mL:1'), [1040, A('mL:1')[1]], [1040, rowY(8) + 12], [colX(1), rowY(8) + 12], 'bb:i8'], R, U, { orth: 1 }); enc('eL_y', 'L', 2, 'bb:j9', 1020); enc('eL_g', 'L', 3, 'bb:j10', 1000);
enc('eR_y', 'R', 2, 'bb:j11', 1000); enc('eR_g', 'R', 3, 'bb:j12', 1020); enc('eR_k', 'R', 1, 'bb:j13', 1060);
wire('eL_b', C.blue, ['mL:0', [940, 472], [940, 272], [1800, 272], [1800, 460], 'bb:b5'], R, L, { orth: 1 });
wire('eR_b', C.blue, ['mR:0', [920, 952], [920, 256], [1816, 256], [1816, 446], [1660, 446], 'bb:a5'], R, D, { orth: 1 });
// servos (plugs facing left, beside Wagos C and D): orange to the RP2040, red to C, brown to D
const SV = { H: ['bb:j19', 2, 0], L: ['bb:j20', 3, 1], R: ['bb:a20', 4, 2] };
for (const k of 'HLR') {
  const [hole, slot, j] = SV[k], o = A('sv' + k + ':o'), r = A('sv' + k + ':r'), n = A('sv' + k + ':n'), en = A(hole);
  const left = k !== 'R';
  wire('s' + k + '_o', C.sig, left
    ? [o, [2540 - j * 14, o[1]], [2540 - j * 14, 1720 + j * 14], [1200 - j * 14, 1720 + j * 14], [1200 - j * 14, en[1]], hole]
    : [o, [2512, o[1]], [2512, 1700], [1860, 1700], [1860, en[1]], hole], L, left ? R : L, { orth: 1 });
  wire('s' + k + '_r', C.red, [r, [2480 - j * 14, r[1]], [2480 - j * 14, 1022 + j * 12], [slotX(slot), 1022 + j * 12], 'wC' + slot], L, U, { orth: 1 });
  wire('s' + k + '_n', C.brown, [n, [2496 - j * 14, n[1]], [2496 - j * 14, 1286 + j * 12], [slotX(slot), 1286 + j * 12], 'wD' + slot], L, U, { orth: 1 });
}
// the battery sense
wire('r22', null, ['bb:b10', 'bb:b22'], D, D, { res: ['red', 'red', 'orange'], label: '22 kΩ' });
wire('r10', null, ['bb:a10', 'bb:a8'], U, U, { res: ['brown', 'black', 'orange'], label: '10 kΩ' });
wire('A4_sense', C.sense, ['wA4', [2275, 518], [1880, 518], [1880, 885], 'bb:a22'], D, L, { orth: 1 });
// the Pi
wire('u_tx', C.tx, ['bb:j1', [1300, 360], [1300, 300], [534, 300], 'pi:10'], L, U, { orth: 1 });
wire('u_rx', C.rx, ['bb:j2', [1286, 385], [1286, 286], [508, 286], 'pi:8'], L, U, { orth: 1 });
wire('u_gnd', C.black, ['bb:j8', [1272, rowY(8)], [1272, 272], [482, 272], 'pi:6'], L, U, { orth: 1 });

// a Catmull-Rom spline through the points, sampled; its cumulative length
function buildOrth(wv) {
  const p = wv.pts, out = [p[0]], rad = 24;
  for (let i = 1; i < p.length - 1; i++) {
    const [a, c, b] = [p[i - 1], p[i], p[i + 1]];
    const la = Math.hypot(c[0] - a[0], c[1] - a[1]), lb = Math.hypot(b[0] - c[0], b[1] - c[1]);
    const r = Math.min(rad, la / 2, lb / 2);
    if (r < 0.5) { out.push(c); continue; }
    const p1 = [c[0] + (a[0] - c[0]) * r / la, c[1] + (a[1] - c[1]) * r / la], p2 = [c[0] + (b[0] - c[0]) * r / lb, c[1] + (b[1] - c[1]) * r / lb];
    for (let k = 0; k <= 8; k++) { const t = k / 8; out.push([(1 - t) * (1 - t) * p1[0] + 2 * (1 - t) * t * c[0] + t * t * p2[0], (1 - t) * (1 - t) * p1[1] + 2 * (1 - t) * t * c[1] + t * t * p2[1]]); }
  }
  out.push(p[p.length - 1]);
  return out;
}
function build(wv) {
  if (wv.orth) { const out = buildOrth(wv), len = [0]; for (let i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1])); wv.s = out; wv.len = len; return; }
  const p = wv.pts, h = 60;
  const pts = [[p[0][0] - wv.sd[0] * h, p[0][1] - wv.sd[1] * h], ...p, [p[p.length - 1][0] + wv.ed[0] * h, p[p.length - 1][1] + wv.ed[1] * h]];
  const out = [];
  for (let i = 1; i < pts.length - 2; i++) {
    const [p0, p1, p2, p3] = [pts[i - 1], pts[i], pts[i + 1], pts[i + 2]];
    const n = Math.max(8, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 6));
    for (let k = (i === 1 ? 0 : 1); k <= n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  // the ends: straight into the hole / slot
  const len = [0];
  for (let i = 1; i < out.length; i++) len.push(len[i - 1] + Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]));
  wv.s = out; wv.len = len;
}

// ---------------------------------------------------------------- camera
const VIEWS = {
  all: [1650, 894, 0.48], bb: [1505, 715, 0.92], bbTop: [1500, 480, 2.0], battery: [2500, 400, 1.0], mddPower: [1520, 1060, 0.59],
  conv: [2450, 846, 0.85], wagos: [2300, 846, 0.85], bbPower: [1950, 740, 1.0], bbMdd: [1020, 1100, 0.8], encL: [960, 660, 1.0],
  encR: [800, 860, 1.0], encB: [965, 683, 0.95], servos: [2520, 1260, 1.0], servosH: [2140, 1250, 0.78], sense: [1650, 680, 1.5],
  senseWire: [1980, 711, 1.1], pi: [880, 351, 1.6], motors: [760, 1010, 0.6], piGnd: [1100, 420, 1.05]
};
let cam = VIEWS.all;
const CY = 430;   // the camera's centre on screen: above the caption card
const wx = (p) => [W / 2 - (p[0] - cam[0]) * cam[2], (p[1] - cam[1]) * cam[2] + CY];
let MIR = false;
function worldT() { MIR = true; g.setTransform(-cam[2], 0, 0, cam[2], W / 2 + cam[0] * cam[2], CY - cam[1] * cam[2]); }
function screenT() { MIR = false; g.setTransform(1, 0, 0, 1, 0, 0); }
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = t => Math.max(0, Math.min(1, t));

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function box(x, y, w, h, r, fill, stroke, lw = 2) { rr(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function text(s, x, y, size, col = C.ink, align = 'left', weight = '', base = 'middle') {
  g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = col; g.textBaseline = base;
  if (!MIR) { g.textAlign = align; g.fillText(s, x, y); return; }
  g.save(); g.translate(x, y); g.scale(-1, 1); g.textAlign = align === 'left' ? 'right' : align === 'right' ? 'left' : align; g.fillText(s, 0, 0); g.restore();
}
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)); return `rgb(${c})`; }
function circle(x, y, r, fill, stroke, lw = 2) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }

// ---------------------------------------------------------------- components (world space)
function drawBench() {
  g.fillStyle = '#e4e8ed'; g.fillRect(-2000, -2000, 8000, 6000);
  g.strokeStyle = '#d8dde3'; g.lineWidth = 2;
  for (let x = -1000; x < 4400; x += 100) { g.beginPath(); g.moveTo(x, -1000); g.lineTo(x, 3000); g.stroke(); }
  for (let y = -1000; y < 3000; y += 100) { g.beginPath(); g.moveTo(-1000, y); g.lineTo(4400, y); g.stroke(); }
}
function drawBreadboard() {
  box(BBX + 20, BBY, 470, 850, 14, '#fbfaf5', '#c7c6bb', 3);
  // the middle gap
  g.fillStyle = '#e6e4da'; g.fillRect(colX(4) + 18, BBY + 20, colX(7) - colX(4) - 36, 810);
  // rails
  for (const [x, col] of [[BBX + 50, C.blue], [BBX + 75, C.red], [colX(11) + 50, C.red], [colX(11) + 75, C.blue]]) {
    g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(x + (col === C.red ? 12 : -12), BBY + 30); g.lineTo(x + (col === C.red ? 12 : -12), BBY + 820); g.stroke();
    for (let r = 1; r <= 30; r++) if (r % 6) { g.fillStyle = '#5b5b5b'; g.fillRect(x - 3.5, rowY(r) - 3.5, 7, 7); }
  }
  for (let r = 1; r <= 30; r++) {
    for (const k of 'abcdefghij') { g.fillStyle = '#4a4a4a'; g.fillRect(colX(COL[k]) - 3.5, rowY(r) - 3.5, 7, 7); }
    text(String(r), colX(0) - 22, rowY(r), 11, '#8a8a80', 'right');
    text(String(r), colX(11) + 22, rowY(r), 11, '#8a8a80', 'left');
  }
  for (const k of 'abcdefghij') { text(k, colX(COL[MIRL(k)]), BBY + 30, 15, '#6f6f66', 'center', 'bold'); text(k, colX(COL[MIRL(k)]), BBY + 835, 15, '#6f6f66', 'center', 'bold'); }
}
function drawPico(lit) {      // the YD-RP2040, chip side down: its back (printed YD-RP2040) up, the USB-C end at row 1
  const x0 = colX(2) - 22, x1 = colX(9) + 22, y0 = rowY(1) - 30, y1 = rowY(20) + 22;
  g.save(); g.shadowColor = 'rgba(0,0,0,0.25)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  box(x0, y0, x1 - x0, y1 - y0, 8, '#1c1c1f', '#000', 2); g.restore();
  box((x0 + x1) / 2 - 26, y0 - 14, 52, 22, 5, null, '#9aa1a9', 2);                     // USB-C, underneath
  text('USB-C end', (x0 + x1) / 2, y0 - 26, 13, C.mute, 'center', 'bold');
  g.save(); g.translate((x0 + x1) / 2, rowY(10.5)); g.rotate(-Math.PI / 2);
  text('YD-RP2040 · chip side down', 0, 0, 17, '#d8d8d8', 'center', 'bold'); g.restore();
  if (lit) { g.save(); g.globalAlpha = 0.5; circle((x0 + x1) / 2, rowY(15), 22, '#ff5252'); g.restore(); text('its LED glows', (x0 + x1) / 2, rowY(15), 12, '#fff', 'center', 'bold'); }
  for (let i = 1; i <= 20; i++) {
    for (const [x, lab, al, dx] of [[colX(2), PICO_L[i - 1], 'left', 14], [colX(9), PICO_R[i - 1], 'right', -14]]) {
      circle(x, rowY(i), 7, '#d9b44a', '#8a6d1e', 1.5); circle(x, rowY(i), 3, '#3b2f0c');
      text(lab, x + dx, rowY(i), 11, USED.has(lab) ? (lab === 'GND' ? '#9fd3b8' : '#ffffff') : '#6b6b6b', al, 'bold');
    }
  }
}
function drawPi() {

function drawResistor(wv, f) {

  const vert = Math.abs(b[1] - a[1]) > Math.abs(b[0] - a[0]), len = Math.min(64, Math.hypot(b[0] - a[0], b[1] - a[1]) - 16);
  g.translate(mx, my); if (vert) g.rotate(Math.PI / 2);
  box(-len / 2, -9, len, 18, 8, '#e9d7a8', '#9c8550', 1.5);
  const bands = { red: '#c62828', orange: '#ef6c00', brown: '#6d4c41', black: '#111', gold: '#c9a227' };

  for (const p of [a, b]) circle(p[0], p[1], 3.5, '#8d949b');
}

// a wire, drawn up to fraction f of its length
function drawWire(wv, f) {
  if (!wv.s) build(wv);
  if (wv.res) return drawResistor(wv, f);
  const total = wv.len[wv.len.length - 1], upto = total * clamp01(f);
  if (upto <= 0) return;
  g.beginPath(); g.moveTo(wv.s[0][0], wv.s[0][1]);
  let i = 1; for (; i < wv.s.length && wv.len[i] <= upto; i++) g.lineTo(wv.s[i][0], wv.s[i][1]);
  let tip = wv.s[i - 1];
  if (i < wv.s.length) { const t = (upto - wv.len[i - 1]) / (wv.len[i] - wv.len[i - 1]); tip = [lerp(wv.s[i - 1][0], wv.s[i][0], t), lerp(wv.s[i - 1][1], wv.s[i][1], t)]; g.lineTo(tip[0], tip[1]); }
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = wv.col === C.white ? '#9aa0a6' : shade(wv.col, -0.35); g.lineWidth = 8.5; g.stroke();
  g.strokeStyle = wv.col; g.lineWidth = 6; g.stroke();
  // pin ends
  const s0 = wv.s[0]; circle(s0[0], s0[1], 4.5, '#3b3b3b');
  if (f >= 1) { const e = wv.s[wv.s.length - 1]; circle(e[0], e[1], 4.5, '#3b3b3b'); }
  else circle(tip[0], tip[1], 6, '#ffffff', wv.col, 2);
}

// ---------------------------------------------------------------- state per step
function stepAt(t) { let i = 0; while (i + 1 < TL.length && TL[i + 1].t0 <= t) i++; return i; }
const before = [];          // wires finished before each step
function prepare() {
  const have = new Set();
  STEPS.forEach((s, i) => { (s.done || []).forEach(w => have.add(w)); before[i] = new Set(have); (s.wires || []).forEach(w => have.add(w)); });
  for (const id in WIRES) build(WIRES[id]);
}
// how far each of this step's wires has grown
function grow(step, lt, dur) {
  const ws = step.wires || [], n = ws.length, out = {};
  const span = Math.max(1.2, (dur - 2.0) * 0.8), gap = n > 1 ? Math.min(2.6, (span - 1.1) / (n - 1)) : 0;
  ws.forEach((w, k) => out[w] = ease((lt - 0.8 - k * gap) / 1.1));
  return out;
}

// ---------------------------------------------------------------- highlights, tags, labels
function pulse(p, t, col = C.hl) {
  const k = 0.5 + 0.5 * Math.sin(t * 5);
  g.save(); g.globalAlpha = 0.55 + 0.35 * k; g.strokeStyle = col; g.lineWidth = 5; g.beginPath(); g.arc(p[0], p[1], 15 + 4 * k, 0, Math.PI * 2); g.stroke(); g.restore();
}
function tag(p, s, dir, alpha, dist) {
  const off = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] }[dir] || [1, 0], d = dist || 46;
  if (MIR) off[0] = -off[0];
  const q = [p[0] + off[0] * d, p[1] + off[1] * d];
  g.save(); g.globalAlpha = alpha; g.font = `bold 18px ${FONT}`; const w = g.measureText(s).width + 20;
  g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
  const bx = off[0] < 0 ? q[0] - w : off[0] > 0 ? q[0] : q[0] - w / 2, by = off[1] < 0 ? q[1] - 32 : off[1] > 0 ? q[1] : q[1] - 16;
  box(bx, by, w, 32, 8, '#fff7d6', C.ink, 2); text(s, bx + w / 2, by + 16, 18, C.ink, 'center', 'bold'); g.restore();
}

  text(fin > 0.9 ? read : '', mx + 130, my + 72, 46, '#1b2412', 'center', 'bold');
  text(m.mode === 'beep' ? '•))) beep mode' : 'V  volts', mx + 130, my + 150, 20, '#3d3000', 'center', 'bold');
  circle(mx + 130, my + 245, 55, '#333', '#111', 3);

  for (const [px, py, col, sx] of [[ax, ay, '#c62828', mx + 80], [bx, by, '#222', mx + 180]]) {

    box(ex - 7, ey, 14, 34, 4, col, '#000', 1.5); g.strokeStyle = '#ccc'; g.lineWidth = 3; g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex, ey - 12); g.stroke();
  }

// ---------------------------------------------------------------- the bench scene
function benchScene(i, lt, dur, t) {
  const s = STEPS[i], v = VIEWS[s.view || 'all'];
  // the camera: from the previous bench view
  let pv = null; for (let k = i - 1; k >= 0; k--) if (STEPS[k].scene === 'bench') { pv = VIEWS[STEPS[k].view || 'all']; break; }
  const e = pv && STEPS[i - 1] && STEPS[i - 1].scene === 'bench' ? ease(lt / 1.3) : 1;
  cam = pv ? [lerp(pv[0], v[0], e), lerp(pv[1], v[1], e), Math.exp(lerp(Math.log(pv[2]), Math.log(v[2]), e))] : v;
  worldT();
  const lit = !!s.lit, plugged = !!s.plugged, cells = plugged || lit;
  drawBench(); drawPi(); drawBreadboard(); drawPico(lit); MOT.forEach((_, k) => drawMotor(k)); drawMDD(lit);
  'ABCD'.split('').forEach(k => drawWago(k)); drawBattery(cells, plugged); drawFuse(); drawSwitch(lit || (s.meter && s.meter.mode === 'volts'), i >= 13); drawConv();
  'HLR'.split('').forEach(k => drawServo(k));
  const gw = grow(s, lt, dur);
  const done = before[i];
  // finished wires (faded a little when this step adds new ones), then this step's
  const focus = (s.wires || []).length > 0;
  for (const id in WIRES) if (done.has(id) && !(s.wires || []).includes(id)) { g.save(); g.globalAlpha = focus ? 0.16 : 0.9; drawWire(WIRES[id], 1); g.restore(); }
  for (const id of (s.wires || [])) drawWire(WIRES[id], gw[id]);
  for (const h of (s.hl || [])) pulse(A(h), t);
  (s.tags || []).forEach(([p, txt, dir, dist], k) => tag(A(p), txt, dir, ease((lt - 0.6 - k * 0.5) / 0.4), dist));
  if (s.labels) bigLabels(ease((lt - 0.5) / 0.6));
  screenT();
  if (s.meter) meter(s.meter, lt, dur);
}

    const bx = px + off[0] - (off[0] < 0 ? w : off[0] > 0 ? 0 : w / 2), by = py + off[1] - 22;
    g.strokeStyle = C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(px, py); g.lineTo(px + off[0], py + off[1]); g.stroke();
    circle(px, py, 8, C.hl, C.ink, 3); box(bx, by, w, 44, 10, '#fff7d6', C.ink, 2.5); text(lab, bx + w / 2, by + 22, 26, C.ink, 'center', 'bold'); g.restore();
  });
}

// ---------------------------------------------------------------- caption card + progress
function caption(i, lt, dur) {
  const s = STEPS[i]; if (s.scene === 'title' || s.scene === 'end') return;
  const a = ease(lt / 0.5) * (1 - ease((lt - dur + 0.35) / 0.35));
  const lines = s.cap || [], h = 86 + lines.length * 40;
  g.save(); g.globalAlpha = Math.max(a, 0.001);
  g.shadowColor = 'rgba(0,0,0,0.2)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  box(40, H - h - 40, 1180, h, 18, 'rgba(255,255,255,0.95)', '#c9d0d8', 2); g.restore();
  g.save(); g.globalAlpha = a;
  text(s.part.toUpperCase(), 72, H - h - 40 + 32, 18, '#ef6c00', 'left', 'bold');
  text(s.title, 72, H - h - 40 + 66, 34, C.ink, 'left', 'bold');
  lines.forEach((l, k) => text(l, 72, H - h - 40 + 108 + k * 40, 26, '#39424e'));
  g.restore();
}
function progress(t, i) {
  g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(0, H - 8, W, 8); g.fillStyle = '#ef6c00'; g.fillRect(0, H - 8, W * t / TOTAL, 8);
  if (STEPS[i].scene !== 'title') text(`${i} / ${STEPS.length - 1}`, W - 40, 40, 22, C.mute, 'right', 'bold');
}

// ---------------------------------------------------------------- frame
function drawStep(i, t) {
  const s = STEPS[i], lt = t - TL[i].t0, dur = TL[i].dur;
  screenT();
  if (s.scene === 'bench') benchScene(i, lt, dur, t);
  else if (s.scene === 'pc') pcScene(s, lt, dur, t);
  else if (s.scene === 'term') termScene(s, lt, dur);
  else if (s.scene === 'wago') wagoScene(s, lt, dur, t);
  else if (s.scene === 'switch') switchScene(s, lt, dur, t);
  else if (s.scene === 'plug') plugScene(s, lt, dur);
  else if (s.scene === 'xt30') xt30Scene(s, lt, dur);
  else if (s.scene === 'drawer') drawerScene(s, lt, dur);
  else if (s.scene === 'map') mapScene(s, lt);
  else if (s.scene === 'title') titleScene(s, lt, false);
  else if (s.scene === 'end') titleScene(s, lt, true);
  else if (s.scene === 'tools') toolsScene(s, lt);
  else if (s.scene === 'checklist') checklistScene(s, lt);
  else if (s.scene === 'order') orderScene(s, lt);
  else if (s.scene === 'solder') solderScene(s, lt, dur);
  else if (s.scene === 'fuse') fuseScene(s, lt, dur);
  else if (s.scene === 'tab') tabScene(s, lt, dur);
  else if (s.scene === 'tail') tailScene(s, lt, dur);
  else if (s.scene === '3d') threeDScene(s, lt);
  screenT(); caption(i, lt, dur);
}
window.render = async function (t, d3) {
  t = Math.min(t, TOTAL - 0.001);
  if (d3) { IMG3D = await loadImg(d3.img); PINS3D = d3.pins || []; }
  const i = stepAt(t), lt = t - TL[i].t0, prev = i > 0 ? STEPS[i - 1] : null, s = STEPS[i];
  drawStep(i, t);
  // a short cross-fade when the scene changes (not between two bench views)
  const fade = 0.45;
  if (prev && lt < fade && !(prev.scene === s.scene && (s.scene === 'bench' || (s.scene === '3d' && prev.asm.id === s.asm.id)))) {
    g.save(); g.globalAlpha = 1 - lt / fade; g.fillStyle = '#e9edf1'; g.fillRect(0, 0, W, H); g.restore();
  }
  screenT(); progress(t, i);
};
function loadImg(src) { return new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; }); }
window.ready = (async () => {
  STEPS = await (await fetch('steps.json')).json();
  TL = await (await fetch('timeline.json')).json();
  TOTAL = TL[TL.length - 1].t0 + TL[TL.length - 1].dur;
  IMG.robot = await loadImg('robot_front.png');
  prepare();
  return { total: TOTAL, steps: STEPS.length };
})();
window.timeline = () => TL.map((x, i) => [i, x.t0, STEPS[i].title]);
