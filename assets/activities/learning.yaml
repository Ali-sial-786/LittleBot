# Early learning games (about 12 months - 5 years): colours, shapes, counting,
# letters, animals, body parts and words.
#
# These are playful exposure, never tests. LittleBot never says "wrong" and never
# keeps score: every try gets warm encouragement, and the real learning happens
# in the conversation between child and caregiver.

activities:

  # ------------------------------------------------------------------ colours
  - id: colour_hunt
    name: Colour Hunt
    description: LittleBot names a colour and you hunt for something that colour together.
    min_age_months: 18
    max_age_months: 48
    category: cognitive
    participation: required
    duration_seconds: 240
    tags: [toddler, colours, exploring]
    materials: [a room with colourful toys, books or clothes]
    parent_instructions: >
      LittleBot names a colour; walk around together and find something that colour,
      then name it out loud ("A red cup!"). Toddlers mix colours up for a long time -
      that's completely normal. Just say the colour warmly ("That one's blue! Let's
      find red too") and keep it playful.
    safety_notes:
      - Stay together while hunting; keep away from stairs, cords and small objects.
    steps:
      - expression: excited
      - say: "Let's go on a colour hunt!"
        animation: bounce
      - repeat: 3
        steps:
          - pick: colour
            from: colours
          - say: "Can you find something {colour.name}?"
            expression: curious
          - say: "{colour.name}, like {colour.things}."
            pause: 2
          - note: "Look around together for something {colour.name}."
          - prompt: "Tap when you've found something {colour.name} (every try is great!)"
            options: ["Found one!", "Help please", "Next colour"]
            timeout: 60
            branches:
              "Found one!":
                - sound: tada
                - say: ["You found {colour.name}! Hooray!", "Wow, {colour.name}! Great hunting!", "Yes, {colour.name}! What a good finder!"]
                  expression: celebrating
                  animation: confetti
              "Help please":
                - say: "Let's look together. Is there something {colour.name} on the floor? On a book? On your clothes?"
                  expression: thinking
                  pause: 3
                - say: "Great looking! Colours are everywhere."
                  expression: happy
      - say: "What a colourful hunt! Thank you, {child_name}!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ shapes
  - id: shape_spotting
    name: Shape Spotting
    description: Learn a shape, draw it in the air, then spot it around the room.
    min_age_months: 24
    max_age_months: 60
    category: cognitive
    participation: recommended
    duration_seconds: 240
    tags: [preschool, shapes, exploring]
    parent_instructions: >
      Draw each shape in the air together with a big finger. Then look for that shape
      around you: plates are circles, windows are often squares or rectangles, a
      slice of toast cut corner to corner makes triangles. "Something like a circle"
      counts!
    safety_notes:
      - Stay together while exploring the room.
    steps:
      - expression: happy
      - say: "Shapes are everywhere! Let's spot some."
        animation: bounce
      - repeat: 3
        steps:
          - pick: shape
            from: shapes
          - say: "This one is a {shape.name}."
            expression: curious
          - say: "{shape.hint}"
            pause: 1
          - say: "Can you draw a {shape.name} in the air with your finger?"
            expression: playful
            pause: 4
          - say: "Now let's find a {shape.name} in the room!"
          - prompt: "Tap when you find a {shape.name} (or something like one)"
            options: ["Found one!", "Next shape"]
            timeout: 60
            branches:
              "Found one!":
                - sound: success
                - say: ["A {shape.name}! Super spotting!", "You found a {shape.name}! Brilliant!"]
                  expression: celebrating
                  animation: sparkle
      - say: "You are a super shape spotter!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ counting 1-3
  - id: count_to_three
    name: One, Two, Three!
    description: Counting to three with claps, toes and kisses - short, bouncy and repeated.
    min_age_months: 15
    max_age_months: 36
    category: numeracy
    participation: recommended
    duration_seconds: 150
    tags: [toddler, counting, numbers, rhythm]
    data:
      things:
        - {what: claps, how: "Clap with me!"}
        - {what: toes, how: "Let's touch three toes."}
        - {what: kisses, how: "Let's blow kisses. Mwah!"}
        - {what: jumps, how: "Bounce or jump with your grown-up!"}
    parent_instructions: >
      Count out loud together and do each action - touch a toe for each number, or
      clap on each count. Toddlers love the rhythm "one, two, THREE!" long before
      they understand counting, so the fun is the point.
    safety_notes:
      - For jumps, hold hands and keep the floor clear.
    steps:
      - expression: happy
      - say: "Let's count to three!"
        animation: bounce
      - for_each: thing
        in: things
        shuffle: true
        limit: 3
        steps:
          - say: "Let's count {thing.what}! {thing.how}"
            expression: excited
            pause: 1
          - repeat: 3
            steps:
              - say: "{round}!"
                animation: bounce
              - sound: pop
                pause: 0.6
          - sound: tada
          - say: "One, two, three {thing.what}! Hooray!"
            expression: celebrating
            pause: 1
      - say: "One, two, three! You are a great counter!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ counting to 10
  - id: count_to_ten
    name: Count to Ten and Blast Off!
    description: Count fingers to ten, do five big jumps, then a rocket countdown - 5, 4, 3, 2, 1, blast off!
    min_age_months: 36
    max_age_months: 72
    category: numeracy
    participation: recommended
    duration_seconds: 240
    tags: [preschool, counting, numbers, movement]
    parent_instructions: >
      Hold up a finger for each number as you count to ten. Jump together for the
      five big jumps, then crouch down low for the rocket countdown and jump up for
      "blast off!". If counting gets muddled, just count again together - that's
      how it's learned.
    safety_notes:
      - Clear a space for jumping, away from furniture and hard edges.
    steps:
      - expression: happy
      - say: "Let's count all the way to ten! Hold up your fingers."
        animation: bounce
        pause: 1
      - repeat: 10
        steps:
          - say: "{round}!"
          - sound: blip
            pause: 0.5
      - sound: tada
      - say: "Ten fingers! Wow!"
        expression: celebrating
        animation: confetti
        pause: 1
      - say: "Now let's do five big jumps. Ready?"
        expression: excited
      - repeat: 5
        steps:
          - say: "Jump! {round}!"
            animation: bounce
          - sound: boing
            pause: 0.8
      - say: "Five big jumps! Great jumping!"
        expression: happy
        pause: 1
      - say: "Now crouch down low like a rocket. Let's count down!"
        expression: curious
        pause: 1
      - for_each: n
        in: [5, 4, 3, 2, 1]
        steps:
          - say: "{n}!"
            expression: excited
          - sound: click
            pause: 0.6
      - sound: whoosh
      - say: "Blast off!"
        expression: celebrating
        animation: spin_eyes
      - gesture: raise_arms
      - say: "Whoosh! You flew all the way to the moon!"
        expression: happy
        animation: sparkle

  # ------------------------------------------------------------------ letters
  - id: letter_sounds
    name: Letter of the Day
    description: Meet a letter, hear its sound, draw it in the air and think of words that start with it.
    min_age_months: 36
    max_age_months: 72
    category: literacy
    participation: recommended
    duration_seconds: 210
    tags: [preschool, alphabet, phonics, letters]
    materials: [paper and crayons, or alphabet blocks (optional)]
    parent_instructions: >
      Say each letter sound together, and draw the letter big in the air or on paper.
      Help think of more words that start with the sound - silly ones count too! This
      is about enjoying sounds, not getting letters "right".
    safety_notes:
      - Choose large alphabet blocks or magnets for under-3s (small pieces are a choking risk).
    steps:
      - expression: happy
      - say: "Let's play with letters!"
        animation: bounce
      - repeat: 2
        steps:
          - pick: letter
            from: letters
          - say: "This is the letter {letter.name}."
            expression: curious
            pause: 0.5
          - say: "{letter.name} says {letter.sound}. {letter.sound}, {letter.sound}!"
            expression: playful
          - say: "{letter.name} is for {letter.words}!"
            expression: happy
            animation: sparkle
            pause: 0.5
          - say: "Let's draw a big {letter.name} in the air. Ready? Draw!"
            pause: 4
          - prompt: "Think of another word that starts with {letter.name} together, then tap"
            options: ["We had a go!", "Next letter"]
            timeout: 45
            branches:
              "We had a go!":
                - sound: success
                - say: "Great thinking! {letter.sound}, {letter.sound}, {letter.name}!"
                  expression: celebrating
      - say: "Every name starts with a letter too. Ask your grown-up which letter your name starts with!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ animal identification
  - id: who_says_that
    name: Who Says That?
    description: Listen to a sound and guess the animal - "Who says moo?" Then LittleBot reveals it.
    min_age_months: 18
    max_age_months: 48
    category: language
    participation: recommended
    duration_seconds: 180
    tags: [toddler, animals, listening, guessing]
    materials: [animal toys or a picture book (optional)]
    parent_instructions: >
      LittleBot makes an animal sound; your child can say or point to the animal.
      Every guess is a good guess - LittleBot always reveals the answer cheerfully.
      If the microphone is off, just play along out loud.
    safety_notes:
      - Toy animals should be too big to fit in a child's mouth.
    steps:
      - expression: curious
      - say: "Listen carefully. Who makes this sound?"
        pause: 0.5
      - repeat: 4
        steps:
          - pick: animal
            from: animals
            prefer_profile: favourite_animals
          - say: "{animal.sound}! {animal.sound}!"
            expression: playful
            animation: wiggle
          - say: "Who says {animal.sound}?"
            expression: listening
          - listen: 5
            expect: ["{animal.name}"]
            on_match:
              - sound: tada
              - say: "Yes! The {animal.name}! Good listening!"
                expression: celebrating
                animation: confetti
            on_heard:
              - say: "Good thinking! It's the {animal.name}! The {animal.name} says {animal.sound}."
                expression: happy
            on_timeout:
              - say: "It's the {animal.name}! The {animal.name} says {animal.sound}!"
                expression: happy
                animation: bounce
          - wait: 1
      - say: "You're a wonderful animal listener!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ body parts
  - id: body_parts
    name: Where's Your Nose?
    description: A finding game with your own body - nose, toes, tummy - plus a silly action for each.
    min_age_months: 12
    max_age_months: 48
    category: language
    participation: recommended
    duration_seconds: 180
    tags: [toddler, body parts, vocabulary, movement]
    parent_instructions: >
      When LittleBot asks "Where is your nose?", point to her nose (and yours!). Let
      her try to point first if she likes. Then do the silly action together.
    safety_notes:
      - Gentle touches only; respect it if she doesn't want to be touched.
    steps:
      - expression: happy
      - say: "Let's find our body parts!"
        animation: bounce
      - for_each: part
        in: body_parts
        shuffle: true
        limit: 5
        steps:
          - say: "{part.question}"
            expression: curious
            pause: 3
          - prompt: "Tap when {child_name|your little one} points to their {part.name} (or you show them)"
            options: ["Found it!", "Next"]
            timeout: 25
            branches:
              "Found it!":
                - sound: pop
                - say: ["There it is! Your {part.name}!", "Yes! That's your {part.name}!"]
                  expression: happy
                  animation: bounce
          - say: "{part.action}"
            expression: playful
            pause: 2
      - say: "You know so many body parts!"
        expression: celebrating
        animation: confetti

  # ------------------------------------------------------------------ vocabulary: opposites
  - id: opposites
    name: Big and Small
    description: A word game with opposites - big and small, fast and slow, loud and quiet - acted out with your body.
    min_age_months: 30
    max_age_months: 72
    category: language
    participation: recommended
    duration_seconds: 210
    tags: [preschool, vocabulary, opposites, movement]
    parent_instructions: >
      Act out each word together - stretch up big, curl up small, clap loudly then
      softly. Acting words out with the body helps them stick. Add your own
      examples ("Daddy's shoes are big, your shoes are small").
    safety_notes:
      - Clear a little space for stretching and moving.
    steps:
      - expression: happy
      - say: "Let's play a word game with opposites!"
        animation: bounce
      - for_each: pair
        in: opposites
        shuffle: true
        limit: 4
        steps:
          - say: "{pair.a} and {pair.b}!"
            expression: curious
            pause: 0.5
          - say: "{pair.a_line}"
            expression: excited
          - say: "{pair.a_act}"
            pause: 3
          - say: "{pair.b_line}"
            expression: playful
          - say: "{pair.b_act}"
            pause: 3
          - say: ["{pair.a} and {pair.b}! Great moving!", "Wonderful! {pair.a} and {pair.b}!"]
            expression: happy
            animation: sparkle
      - say: "You know lots of opposites. Big words for a clever kid!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ question and answer
  - id: question_time
    name: Question Time
    description: Simple, friendly questions to talk about - every answer is welcome, and LittleBot shares a fun fact.
    min_age_months: 30
    max_age_months: 72
    category: language
    participation: recommended
    duration_seconds: 240
    tags: [preschool, conversation, questions, talking]
    data:
      questions:
        - {q: "What does a cow say?", a: "A cow says moo!"}
        - {q: "What do we wear on our feet?", a: "Socks and shoes go on our feet."}
        - {q: "What colour is the sky?", a: "The sky is often blue. At sunset it can be orange and pink!"}
        - {q: "What do bees make?", a: "Bees make sweet, sticky honey."}
        - {q: "Where do fish live?", a: "Fish live in the water. Splish, splash!"}
        - {q: "What do you like to play with?", a: "That sounds like so much fun!"}
        - {q: "What is your favourite food?", a: "Yum! That sounds tasty."}
        - {q: "What comes out in the sky at night?", a: "The moon and the twinkly stars!"}
        - {q: "What do we use to brush our teeth?", a: "A toothbrush! Brush, brush, brush."}
        - {q: "What makes you laugh?", a: "I love laughing too! Ha ha!"}
    parent_instructions: >
      LittleBot asks a question and listens (if the microphone is on). Help your child
      answer in their own words - there are no wrong answers here. If LittleBot didn't
      hear, tap "Answered!" and it will carry on. Chat a bit more about each one!
    safety_notes:
      - Nothing your child says is recorded or stored.
    steps:
      - expression: happy
      - say: "It's question time! I'll ask, you answer."
        animation: bounce
      - for_each: q
        in: questions
        shuffle: true
        limit: 4
        steps:
          - say: "{q.q}"
            expression: curious
          - listen: 7
            on_heard:
              - say: ["Good thinking!", "Ooh, I like that!", "Thank you for telling me!"]
                expression: happy
              - say: "{q.a}"
            on_timeout:
              - prompt: "Did {child_name|your child} answer? (LittleBot may not have heard)"
                options: ["Answered!", "Tell us"]
                timeout: 20
                branches:
                  "Answered!":
                    - say: ["Good thinking!", "What a great answer!"]
                      expression: happy
                    - say: "{q.a}"
                  "Tell us":
                    - say: "{q.a}"
                      expression: happy
                on_timeout:
                  - say: "Hmm, let me think. {q.a}"
                    expression: thinking
          - animation: sparkle
            pause: 1
      - say: "I love talking with you, {child_name}!"
        expression: affectionate
        animation: hearts

  # ------------------------------------------------------------------ vocabulary: I spy
  - id: i_spy
    name: I Spy Clues
    description: LittleBot gives a simple clue - "something that keeps your feet warm" - and you find it together.
    min_age_months: 36
    max_age_months: 72
    category: language
    participation: required
    duration_seconds: 240
    tags: [preschool, vocabulary, describing, problem solving]
    data:
      clues:
        - {clue: "something you can sit on", answer: "a chair, a sofa, or even the floor"}
        - {clue: "something that keeps your feet warm", answer: "socks or slippers"}
        - {clue: "something you drink from", answer: "a cup or a bottle"}
        - {clue: "something soft you can cuddle", answer: "a teddy, a pillow or a blanket"}
        - {clue: "something with pages", answer: "a book"}
        - {clue: "something that lets the light in", answer: "a window"}
        - {clue: "something you can open and close", answer: "a door, a box or a book"}
        - {clue: "something that rolls", answer: "a ball or a toy car"}
    parent_instructions: >
      LittleBot gives a clue; look around and find something that fits together.
      There can be lots of right answers - anything that fits the clue is great. Talk
      about why it fits ("Socks keep feet warm - and so do slippers!").
    safety_notes:
      - Stay together while searching; keep away from stairs, cords and the kitchen stove.
    steps:
      - expression: playful
      - say: "Let's play I spy! I'll give you a clue."
        animation: bounce
      - for_each: c
        in: clues
        shuffle: true
        limit: 3
        steps:
          - say: "I spy with my little eye... {c.clue}!"
            expression: curious
            pause: 1
          - say: "Can you find {c.clue}?"
            pause: 2
          - prompt: "Tap when you've found something that fits"
            options: ["Found it!", "Need a hint"]
            timeout: 60
            branches:
              "Found it!":
                - sound: tada
                - say: ["Great finding! That fits!", "Yes! Super spying!"]
                  expression: celebrating
                  animation: confetti
              "Need a hint":
                - say: "Hmm, it could be {c.answer}. Can you see one?"
                  expression: thinking
                  pause: 4
                - say: "Great looking!"
                  expression: happy
      - say: "You are a super spy!"
        expression: affectionate
        animation: hearts
