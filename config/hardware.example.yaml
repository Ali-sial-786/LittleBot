# LittleBot - Raspberry Pi hardware configuration TEMPLATE.
#
# scripts/install_pi.sh copies this file to config/local.yaml (git-ignored) when that
# file does not exist yet; it never overwrites an existing local.yaml. Edit local.yaml,
# not this file.
#
# Layering (later wins): default.yaml -> pi.yaml -> local.yaml -> LITTLEBOT__* env vars.
# Everything here repeats pi.yaml's values on purpose, so you can see and change the
# knobs that matter on the robot in one place. Delete lines you do not need.
#
# Values marked UNVERIFIED are educated guesses until the hardware is tested
# (HARDWARE_ARRIVAL_CHECKLIST.md). Check your edits with:
#   .venv/bin/python scripts/diagnose.py --section config
#
# Secrets (API keys) never go in YAML - they live in .env (see .env.example).

# ---------------------------------------------------------------------------
# Display: DORHEA MPI3508 3.5" HDMI screen, 480x320 panel.
# The app draws its face at width x height and fills the screen. If the Pi drives the
# HDMI output at another mode (e.g. 720x480 or 640x480 - see docs/DISPLAY_SETUP.md),
# keep these at 480x320: they are the face's drawing size, not the HDMI mode.
# ---------------------------------------------------------------------------
display:
  width: 480
  height: 320
  fullscreen: true
  scale: 1.0
  output_mode: "720x480@60"  # HDMI mode LittleBot asks for at start (the panel's 3:2 shape); null = desktop's mode
  video_driver: wayland      # true fullscreen + hidden pointer under labwc; null = SDL's default (X11 via Xwayland)
  hide_cursor: true        # no mouse pointer over the face
  show_sim_panel: false    # desktop-simulator side panel: off on the robot
  fps: 30                  # while animating
  idle_fps: 15             # when nothing moves: saves CPU and heat

# ---------------------------------------------------------------------------
# Camera: InnoMaker U20CAM-1080P (USB 2.0 UVC). Find it with:
#   .venv/bin/python scripts/check_camera.py --list     (or: v4l2-ctl --list-devices)
# device: auto (first USB camera) | an index such as 0 | a path such as /dev/video0.
# On the Pi 5, /dev/video19+ belong to the ISP / video decoder, not to your camera.
# ---------------------------------------------------------------------------
camera:
  backend: auto            # auto | real | mock | none   (switch to real once the camera is confirmed)
  device: auto
  capture_width: 640       # 640x480 MJPG keeps USB bandwidth and CPU low; 1080p is not needed
  capture_height: 480
  capture_fps: 15
  fourcc: MJPG
  process_width: 320       # detection runs on a 320 px wide copy
  detect_fps: 15.0         # face detections per second (every frame; lower it if the CPU is busy)
  mirror: true

vision:
  detector: yunet          # yunet | haar | none - falls back automatically. Measured on the Pi 5 (U20CAM, 320 px):
                           # YuNet found the face in 100 % of frames at 7.9 ms each, Haar in 1 % at 13.6 ms

# ---------------------------------------------------------------------------
# Audio: mini USB microphone + mini USB speaker (the Pi 5 has no headphone jack).
# device: null = the USB speaker / microphone when plugged in (never the HDMI screen, whatever
# the desktop's default is); "system" = the desktop's default; otherwise a NAME SUBSTRING (robust when USB ports
# change) or an index. List names with:
#   .venv/bin/python scripts/check_audio.py --list      (or: arecord -l / aplay -l)
# Examples (UNVERIFIED - copy the real names from the list): "USB PnP Sound Device",
# "UACDemo", "USB Audio".
# ---------------------------------------------------------------------------
audio:
  microphone:
    backend: auto          # auto | real | mock | none
    device: null
  speaker:
    backend: sounddevice   # auto | sounddevice | pygame | mock | none
    device: null
    volume: 0.4            # start quiet; parents can change it in the dashboard
    max_volume: 0.7        # hard ceiling - test loudness at the child's ear distance first
  echo_cancel: auto        # auto | on | off: PipeWire's echo-cancelled devices when they exist
                           # (scripts/setup_echo_cancel.sh, docs/PI_SETUP.md; untested on the Pi)
  tts:
    provider: auto         # espeak-ng (installed by install_pi.sh) unless a piper model is set

# ---------------------------------------------------------------------------
# Media: the YouTube player runs in Chromium (kiosk window) on the robot's screen.
# browser_command: null autodetects chromium-browser (Bookworm) / chromium (Trixie).
# ---------------------------------------------------------------------------
media:
  player: auto             # auto | browser | kiosk | none (none = no video at all)
  browser_command: null

# ---------------------------------------------------------------------------
# Motion: 3-4x MG90S on a PCA9685 (head pan, arms, optional head tilt; docs/MOVEMENT.md).
# Follow docs/MOTION_SAFETY.md step by step:
#   1. physical_enabled: false, backend: mock   <- start here (simulated servos)
#   2. servos wired to their OWN regulated supply (common ground with the Pi),
#      MOTION_SAFETY.md checklist A-C done -> physical_enabled: true, backend STILL mock
#      (this is the calibration stage: scripts/calibrate_servos.py writes
#      config/calibration.yaml; format reference: config/calibration.example.yaml)
#   3. only with a valid calibration and checklist part D done -> backend: pca9685
#      (a parent must still arm motion in the dashboard after every start)
# diagnose.py reports "calibration pending" in stage 2 and FAILs backend: pca9685 +
# physical_enabled: true without a valid calibration. The installer never enables motion.
# ---------------------------------------------------------------------------
motion:
  backend: mock            # mock | pca9685
  physical_enabled: false
  i2c_bus: 1               # /dev/i2c-1 = GPIO2 (SDA, pin 3) / GPIO3 (SCL, pin 5)
  i2c_address: 0x40        # PCA9685 default address

# ---------------------------------------------------------------------------
# Sign in with ChatGPT + live voice (docs/CHATGPT.md). Sign in and start calls on the
# dashboard's AI page; the sign-in is stored in data/chatgpt_auth.json (mode 0600), never
# here. Live voice needs the "live" extra (install_pi.sh installs it unless --no-live).
# The defaults suit the robot; uncomment to change them.
# ---------------------------------------------------------------------------
# chatgpt:
#   live_voice: bubbie             # asked for first; if OpenAI refuses it, live_voice_fallbacks in order
#   live_voice_fallbacks: [sol]    # known voices: cove | arbor | breeze | ember | juniper | maple | sol | spruce | vale
#   live_session_minutes: 10       # hard limit per call (the voice says goodbye, then hangs up)
#   live_idle_hangup_seconds: 90   # hang up after this long with nobody talking (0 = never)
#   live_half_duplex: true         # without echo cancelling: mic sends silence while LittleBot talks
#   live_echo_tail_ms: 450         # ...and for this long after; raise it if the voice hears itself
#   live_barge_in: auto            # a grown-up talking over the voice stops it: auto = only with echo
#                                  # cancelling (scripts/setup_echo_cancel.sh, untested on the Pi) | on | off
#   live_barge_in_speech_ms: 300   # this much grown-up speech interrupts it
#   live_barge_in_over_echo_db: 8.0  # ...louder than what is left of its own voice by this much
#   live_barge_in_min_level: 0.008    # ...and at least this loud (mic RMS)
#   live_barge_in_max_pitch_hz: 260.0 # voiced above this = a child: doesn't interrupt
#   live_barge_in_false_alarm_ms: 2500  # no words of theirs by then: the voice carries on
#   live_volume: null              # null = the speaker volume; always capped at audio.speaker.max_volume
#   look_models: []                # camera looks: models tried first (e.g. a faster one), then `models`
#   look_effort: null              # simple looks ("what colour is this?"): null = none
#   look_count_effort: null        # counting / reading looks: null = minimal
#   look_detail: auto              # auto | low | high: photo detail (auto: high only for counting / reading)

# ---------------------------------------------------------------------------
# Parent dashboard.
# lan_access: false -> only this Pi can open http://127.0.0.1:8765 (safest default).
# lan_access: true  -> phones on your home Wi-Fi can reach http://<pi-ip>:8765 (or
#                      http://<hostname>.local:8765). Only on a trusted home network,
#                      after setting a strong dashboard password (first-run setup code
#                      is printed in the app log). Never forward this port on your router.
# Leave host at 127.0.0.1: lan_access is the switch that opens it to the network.
# ---------------------------------------------------------------------------
dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8765
  lan_access: false

# ---------------------------------------------------------------------------
# Logging: JSON lines; also written to data/logs/littlebot.log (rotating, 3 x 2 MB).
# The service's stdout/stderr go to the journal: journalctl --user-unit littlebot
# ---------------------------------------------------------------------------
logging:
  level: INFO              # DEBUG while bringing up hardware
  format: json
  file: logs/littlebot.log # relative to data_dir (data/)
