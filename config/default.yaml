# LittleBot default configuration.
#
# Mode-specific overlays (simulation.yaml / pi.yaml / offline.yaml) are applied
# on top of this file, then config/local.yaml (git-ignored, your machine only),
# then environment variables LITTLEBOT__<SECTION>__<KEY>.
#
# API keys never go in YAML - use .env (see .env.example).
# Parent-editable settings (privacy, volume, child profile...) are stored in
# data/littlebot.db via the dashboard; the values here are only their defaults.

robot_name: LittleBot
data_dir: data

logging:
  level: INFO
  format: console        # console | json
  file: logs/littlebot.log

display:
  width: 480
  height: 320
  fps: 30
  idle_fps: 20
  scale: 2.0
  fullscreen: false
  show_debug: false
  show_sim_panel: true

face:
  eye_color: [90, 210, 255]
  background_color: [255, 214, 228]   # soft light pink (a dark colour, e.g. [6, 8, 14], gives glowing eyes)
  glow: true

camera:
  backend: auto          # auto | real | mock | none   (auto: real camera, else mock in simulation/offline)
  device: auto           # auto (first USB camera) | index (0) | /dev/videoN  -- see scripts/check_camera.py --list
  capture_width: 640
  capture_height: 480
  capture_fps: 15
  fourcc: MJPG           # compressed frames: low USB 2.0 bandwidth
  process_width: 320     # detection runs on a 320 px wide copy (CPU budget on the Pi)
  detect_fps: 6.0
  mirror: true           # camera faces the child: image-right => eyes look to the robot's right
  reconnect_seconds: 3.0

vision:
  # yunet: small CNN, ~4x cheaper than Haar here and more robust (needs scripts/download_models.py).
  # If its model is missing it falls back to haar (OpenCV 4.x), then to none - it never crashes.
  detector: yunet        # yunet | haar | none
  min_face_fraction: 0.08   # ignore faces narrower than 8% of the frame (people farther than ~1.3 m)
  present_after_seconds: 0.6
  left_after_seconds: 3.0
  gaze_smoothing: 0.35
  gestures_enabled: false   # experimental; parents can toggle it in the dashboard
  pause_during_media: true  # no frame decoding / detection while a video plays (CPU for Chromium)
  sleep_detect_fps: 1.5     # while SLEEPING: low-rate presence detection so a person can wake the robot

audio:
  half_duplex: true
  store_recordings: false
  microphone:
    backend: auto        # auto | real | mock | none
    device: null         # null = system default, or an index / name substring
  speaker:
    backend: auto        # auto | sounddevice | pygame | mock | none
    device: null
    volume: 0.5
    max_volume: 0.8      # hard safety ceiling
  tts:
    provider: auto       # auto | mock | espeak | piper | openai
    rate: 0.9
  stt:
    provider: auto       # auto | mock | vosk | openai

ai:
  provider: mock         # mock | anthropic | openai  (cloud needs parent opt-in in the dashboard)
  max_output_tokens: 120
  max_words: 60          # reply length cap (any age): room for two to four sentences
  timeout_seconds: 12
  max_requests_per_hour: 60
  max_requests_per_day: 200
  daily_budget_usd: 0.50
  min_age_months_for_cloud: 0   # 0: cloud AI at any age once a parent switches it on; e.g. 24 for 2 years+
  store_transcripts: false   # true AND the parent "record history" setting are both needed to keep transcripts
  creator: Ali              # who made LittleBot (the AI knows; null: not said)
  creator_relation: the little one's dad
  anthropic_model: claude-haiku-5-5   # fast, low-cost current Claude model
  openai_model: gpt-4o-mini
  anthropic_effort: low      # low | medium | high (thinking depth on current Claude models)
  anthropic_thinking: adaptive  # adaptive | disabled (disabled is accepted by Haiku 5.5, not by Opus/Sonnet 5.5)
  thinking_headroom_tokens: 400  # extra max_tokens so thinking never starves the short reply
  context_turns: 3           # in-memory only; cleared on stop / sleep / STOP ALL / after context_ttl_seconds
  context_ttl_seconds: 120
  max_input_chars: 300
  listen_timeout_seconds: 8
  say_didnt_hear: true
  reply_to_utterance_events: true
  share_child_name: true     # tell the AI the child's nickname (Settings profile); the parent can switch it off
  share_interests: false     # favourite animals / interests in the cloud prompt only with parent opt-in
  # price_per_mtok:          # optional overrides of the built-in price estimates (USD per 1M tokens)
  #   claude-haiku-5-5: [0.10, 0.50]

screens:
  # Info cards on LittleBot's screen while it talks (weather, a word, a recipe step, a timer).
  # The parent can switch them, and pictures from the internet, off on the dashboard's Privacy page.
  enabled: true
  linger_seconds: 30       # a card stays this long after the voice chat ends (a running timer stays until done)
  presenter_backing: true  # the presenter's small eyes sit on a patch of LittleBot's pink face

text:  # the text model for cards, the screen director and hand-offs during a voice chat (docs/CLAUDE.md)
  provider: claude       # chatgpt | claude (ANTHROPIC_API_KEY, claude.model); the live voice stays GPT-Live
  fallback: true         # claude: a failure or a slow first word goes to claude.fallback_models, then ChatGPT

claude:  # Anthropic API (pip install -e '.[claude]'); the key in .env or data/anthropic_api_key (chmod 600)
  model: claude-haiku-5-5   # best and cheapest in the 2026-10-29 voice test; no key: ChatGPT answers instead
  fallback_models: [claude-haiku-4-5]   # tried in turn before ChatGPT
  effort: low
  thinking: disabled     # adaptive | disabled (fastest; Haiku 4.5 never thinks)
  first_token_timeout_seconds: 4.0
  web_search: true       # Anthropic's web search for current facts (billed per search)

assistant:  # the fast voice pipeline (docs/ASSISTANT.md): speech-to-text -> Claude -> natural voice, with barge-in
  pipeline: auto         # auto: the assistant once DEEPGRAM_API_KEY and CARTESIA_API_KEY (or ELEVENLABS_API_KEY) are set,
                         # else GPT-Live as before | cascade: always the assistant | live: always GPT-Live
  stt: [deepgram, openai, vosk]                    # first that works
  tts: [cartesia, elevenlabs, openai, local]       # first that works (local: piper / espeak on the robot)
  follow_up_seconds: 8   # keeps listening this long after an answer: no wake word for the next question
  deep_model: claude-sonnet-5-5   # think_harder: hard questions go to this model while a short line plays
  barge_in: true         # talk over LittleBot to interrupt it (needs echo cancelling, like GPT-Live)

skills:  # LittleBot's abilities for both voices (littlebot/skills); each one can be switched off
  persona: warm          # warm | witty | calm | concise | playful (or by voice: "be more concise")
  home_assistant_url: ""  # e.g. http://homeassistant.local:8123 (token: HOME_ASSISTANT_TOKEN in .env)
  music_provider: auto   # auto (Spotify when it's set up and its speaker is ready, else YouTube) | spotify | youtube
  spotify_client_id: ""  # your app's Client ID from developer.spotify.com (or on the dashboard); docs/SPOTIFY.md

decide:  # fast decision models for small multiple-choice calls (littlebot/decide, docs/DECISIONS.md)
  provider: "off"        # off | jev (TYPESAFE_API_KEY in .env) | openai (OPENAI_API_KEY) | claude (ANTHROPIC_API_KEY)
  jev_model: jev-latest
  claude_model: null     # null = claude.model
  openai_model: gpt-6-luna
  timeout_seconds: 2.0
  default_mode: shadow   # per feature: off | shadow (decide alongside, only log both) | on (use it when sure)
  modes: {}              # e.g. {cards: on, routing: shadow}
  min_confidence: 0.5
  yes_at: 0.7
  max_requests_per_hour: 600
  max_requests_per_day: 4000
  log_context: true      # each logged decision also says what was heard and said, and who was recognised

browser:
  # Google (SafeSearch on) on LittleBot's screen when a grown-up says "google it" or "look it up online"
  # (docs/BROWSER.md). Same Chromium as the videos (media.browser_command); never at the same time as a video.
  # The parent can switch it off on the dashboard's Privacy page; it also needs Cloud communication on.
  enabled: true
  idle_seconds: 120        # closes this long after the voice chat ended with nobody touching the page
  moved_on_seconds: 20     # ...and during the chat, this long after they moved on to something else
  zoom: 1.4                # pages are this much bigger on the small screen ("zoom in" / "zoom out" change it)
  mobile_layout: false     # true: claim to be a phone for sites' phone layout (Google then asks more captchas)
  kiosk: null              # null = full screen on the robot only (a 720x480 window on a desktop)

power:
  # The battery (docs/POWER.md section 8): an RP2040-Zero battery monitor on a USB port. Without one
  # LittleBot behaves exactly as on mains power. Low / shutdown levels are dashboard settings.
  monitor: auto            # auto (a UPS HAT (E) on I2C, else the USB serial ports) | ups_hat_e | simulated (desktop preview) | none
  corner: true             # the battery percentage always in the face's top-left corner (hidden under cards and games)
  port: null               # null = find it; or e.g. /dev/serial/by-id/usb-MicroPython_Board_...
  allow_poweroff: null     # switch the Pi off when empty / too hot. null = on the Pi only, never in the simulation
  hot_celsius: 50          # dashboard warning
  shutdown_celsius: 60     # clean shutdown

media:
  player: auto           # auto | browser | kiosk | none  (auto: Pi -> kiosk Chromium, desktop -> browser)
  browser_command: null  # null = autodetect chromium-browser / chromium
  session_limit_minutes: 15
  daily_limit_minutes: 30
  min_age_months_for_video: 18   # video is off below this age unless a parent explicitly allows it
  default_volume: 0.5
  max_volume: 0.8
  player_base_url: null  # null = http://127.0.0.1:<dashboard.port> (the robot's own browser)
  youtube_host: nocookie # nocookie (youtube-nocookie.com) | standard (youtube.com)
  oembed_titles: false   # optional title lookup from youtube.com/oembed when the parent gives none
  connect_timeout_seconds: 60
  max_pause_minutes: 10
  chat_pause_minutes: 2  # a video paused for a chat ("Hey LittleBot" while it plays) stops this long after the chat

motion:
  # Servos are SIMULATED unless backend=pca9685 AND physical_enabled=true AND a valid
  # calibration file exists - and even then outputs stay off until a parent arms motion
  # in the dashboard (never remembered across restarts). Read docs/MOTION_SAFETY.md first.
  backend: mock          # mock | pca9685
  physical_enabled: false   # keep false until servos are wired, powered separately, and calibrated
  i2c_bus: 1
  i2c_address: 0x40
  pwm_frequency: 50      # Hz; analog servos (MG90S) expect 50 Hz (allowed 40..60)
  update_hz: 50          # motion scheduler rate while moving (idle = no ticks at all)
  positions_hz: 10       # motion.positions events while moving
  speed_scale: 1.0       # global slow-down for every movement (0 < x <= 1)
  min_move_seconds: 0.25
  settle_seconds: 0.5    # hold after energising a joint before moving it
  stop_all_returns_to_neutral: true   # parent STOP: halt smoothly, then return slowly to neutral
  homing_speed_factor: 0.4
  release_when_idle_seconds: 0        # >0 de-energises servos after idling this long
  calibration_file: config/calibration.yaml   # written by scripts/calibrate_servos.py (git-ignored)
  # Per-joint limits (defaults are built in; calibration.yaml overrides them). "head" is the head's
  # PAN axis (left/right), "head_tilt" its TILT axis (up/down). If you override `servos` here you
  # must list ALL the joints your robot has (leave out one that is not fitted, e.g. head_tilt):
  # servos:
  #   head:      {channel: 0, neutral: 90,  min_angle: 50, max_angle: 130, max_speed_dps: 60}
  #   left_arm:  {channel: 1, neutral: 20,  min_angle: 10, max_angle: 150, max_speed_dps: 90}
  #   right_arm: {channel: 2, neutral: 160, min_angle: 30, max_angle: 170, max_speed_dps: 90,
  #               inverted: true, positive_toward: min}
  #   head_tilt: {channel: 3, neutral: 90,  min_angle: 70, max_angle: 110, max_speed_dps: 60}
  # (each joint also takes max_accel_dps2, min/max_pulse_us and soft_margin_deg: see docs/MOVEMENT.md)
  # Body language (littlebot/motion/body.py): gaze, nods and small gestures that follow the conversation.
  # The face parts work without servos; movements stay simulated until real servos are armed.
  body_language: true
  body_language_gap_seconds: 1.5   # at most one gesture (and one face nod) this often
  idle_motion_seconds: 90          # a tiny idle head shift about this often (0 = never)
  look:                  # look_at(x, y): eyes lead, the head follows
    camera_on_head: true # the camera sits in the head's top pod (false: fixed to the body)
    fov_h_deg: 70        # the camera's field of view
    fov_v_deg: 45
    follow_offset: 0.15  # the head turns when the target stays this far off-centre (0..0.5 of the view)...
    follow_after_seconds: 0.4   # ...for this long
    gain: 0.8            # how much of the offset one head turn takes
    settle_seconds: 0.6
    speed: 0.5           # fraction of each head joint's max speed
  drive:                 # the wheels phase (littlebot/motion/drive.py): nothing calls it yet
    enabled: false       # commands are refused while false
    backend: mock        # mock | motor_hat (placeholder: needs physical_enabled + arming, like the servos)
    max_linear_mps: 0.15
    max_angular_dps: 60
    max_linear_accel_mps2: 0.3
    max_angular_accel_dps2: 180
    cruise_linear_mps: 0.10
    cruise_angular_dps: 45
    watchdog_seconds: 1.0         # an open-ended drive() stops unless re-sent within this long
    max_duration_seconds: 10
    wheel_base_m: 0.12

dashboard:
  enabled: true
  host: 127.0.0.1        # localhost only
  port: 8765
  lan_access: false      # set true (explicit opt-in) to allow phones on your home Wi-Fi
                         # (plain HTTP: trusted home Wi-Fi only, never port-forward it)
  allowed_hosts: []      # extra names the dashboard answers to, e.g. [littlebot.home] (localhost works on any port);
                         # localhost, 127.0.0.1, this machine's hostname(.local) and (with lan_access)
                         # its LAN IPs are always allowed - other Host names get 400 (DNS rebinding)

activities:
  time_scale: 1.0
  caregiver_timeout_seconds: 45
  record_history: false
  custom_dirs: [activities]   # your own YAML activities go in data/activities/ (see docs/ACTIVITY_GUIDE.md)
  random_seed: null           # set a number for reproducible random picks

privacy:
  camera_enabled: true
  microphone_enabled: true
  cloud_enabled: false

system:
  # auto: a 4 GB or bigger board keeps more loaded (recognition models, cards' pictures, full face tracking
  # with the browser open); a 2 GB one lets them go to make room. small / roomy force one (docs/PERFORMANCE.md).
  memory: auto
