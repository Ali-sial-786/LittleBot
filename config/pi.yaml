# Raspberry Pi 5 (2 GB) with the 480x320 HDMI screen and USB camera/mic/speaker.
# UNVERIFIED until the hardware arrives - see HARDWARE_ARRIVAL_CHECKLIST.md.
display:
  scale: 1.0
  fullscreen: true
  # The MPI3508's EDID prefers 1280x720, which its scaler squashes into the 3:2 panel.
  # 720x480 is the panel's own shape (checked on the real screen 2026-10-22).
  # null = keep whatever mode the desktop uses.
  output_mode: "720x480@60"
  # Native Wayland window: true fullscreen over the taskbar and no mouse pointer
  # (checked on the robot 2026-10-22; SDL's default X11-via-Xwayland showed both).
  video_driver: wayland
  show_sim_panel: false
  hide_cursor: true
  fps: 30
  idle_fps: 15
camera:
  backend: real
  capture_width: 640
  capture_height: 480
  capture_fps: 15
  process_width: 320
  detect_fps: 15.0      # every camera frame: smoother eye tracking (Pi 5: YuNet ~8 ms each, ~12 % of one core)
audio:
  microphone:
    backend: real
    device: null        # set to a name substring, e.g. "USB PnP" after running scripts/check_audio.py
  speaker:
    backend: sounddevice
    device: null        # null = the USB speaker when plugged in, never HDMI; or a name substring, e.g. "UACDemo"
  tts:
    provider: auto      # espeak-ng if installed; piper if a model is configured
motion:
  backend: mock         # switch to pca9685 only after calibration (docs/MOTION_SAFETY.md)
  physical_enabled: false
logging:
  format: json
