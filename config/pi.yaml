# Raspberry Pi 5 (4 GB) with the 7" 1024x600 HDMI touch screen (GeeekPi) and USB camera/mic/speaker.
# A 2 GB board also works: system.memory: auto (config/default.yaml) keeps less loaded there.
# UNVERIFIED until the hardware arrives - see HARDWARE_ARRIVAL_CHECKLIST.md.
display:
  scale: 1.0
  fullscreen: true
  # The 7" panel's own pixels. If the desktop already runs it at 1024x600 (its EDID's preferred mode) nothing
  # changes; if it picked another mode (some of these boards also offer 1280x720 / 1920x1080, which the
  # scaler squeezes) this puts it back. null = keep whatever mode the desktop uses.
  # (The old 3.5" MPI3508 used "720x480@60".)
  output_mode: "1024x600@60"
  # Native Wayland window: true fullscreen over the taskbar and no mouse pointer
  # (checked on the robot 2026-10-22; SDL's default X11-via-Xwayland showed both).
  video_driver: wayland
  show_sim_panel: false
  hide_cursor: true
  fps: 30
  idle_fps: 15
camera:
  backend: real
  capture_width: 1920
  capture_height: 1080
  capture_fps: 30
  process_width: 320
  detect_fps: 15.0      # every other camera frame: smooth eye tracking (Pi 5: YuNet ~8 ms each, ~12 % of one core)
audio:
  microphone:
    backend: real
    device: null        # set to a name substring, e.g. "USB PnP" after running scripts/check_audio.py
  speaker:
    backend: sounddevice
    device: null        # null = the USB speaker when plugged in, never HDMI; or a name substring, e.g. "UACDemo"
  tts:
    provider: auto      # espeak-ng if installed; piper if a model is configured
motion:
  backend: mock         # the servos: switch to pca9685 only after calibration (docs/MOTION_SAFETY.md)
  # Off in every shipped config (docs/MOTION_SAFETY.md). For v5's real wheels (the RP2040 base) set
  # motion.physical_enabled: true in config/local.yaml: a parent can then arm them on the dashboard (Motion page),
  # nothing moves before that, and the servos stay simulated while backend is mock.
  physical_enabled: false
  drive:
    enabled: true
    backend: rp2040     # the base over the Pi's UART (firmware/base_controller): "D <left %> <right %>"
    port: /dev/ttyAMA0
    top_speed_mm_s: 350 # the firmware's max_mm_s
    wheel_base_m: 0.185 # v5: the wheels' centres, 2 x (61.5 + 44.5 - 13.5) mm
    max_linear_mps: 0.25
    max_angular_dps: 90
    max_linear_accel_mps2: 0.4   # under the firmware's own ramp (0.5 m/s2), so it keeps up
    cruise_linear_mps: 0.15      # "forward 50 cm" / "turn left" speeds
    cruise_angular_dps: 60
logging:
  format: json
